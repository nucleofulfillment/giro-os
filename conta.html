<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Minha comanda · LiveFood</title>
<!-- Conta da comanda do buffet pelo celular. Abre pelo QR impresso na comanda: conta.html?l=<loja>&n=<número>&t=<assinatura>.
     Mostra os itens e o total e, se a loja recebe Pix pelo sistema, gera o Pix e acompanha o pagamento (Worker 311: /live/conta e /live/conta-pix). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F4F4F5; --s4: #E8E8EB; --tx: #1C1C1E; --mu: #8E8E93; --mu2: #5E5E66; --pri: #FF5A00; --ok: #16A34A; --f: 'Manrope', system-ui, sans-serif; --ft: 'Baloo 2', system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--tx); font-family: var(--f); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  [hidden] { display: none !important; }
  main { max-width: 460px; margin: 0 auto; padding: 22px 16px calc(96px + env(safe-area-inset-bottom)); }
  .loja { font: 800 24px/1.1 var(--ft); letter-spacing: -.4px; text-wrap: balance; }
  .rot { margin-top: 2px; font-size: 13.5px; font-weight: 600; color: var(--mu2); }
  .papel { margin-top: 16px; background: #fff; border-radius: 18px; border: 1.5px solid var(--s4); padding: 16px; }
  .num { text-align: center; font: 800 34px/1 var(--ft); padding-bottom: 10px; }
  .num small { display: block; font: 800 11px/1.5 var(--f); letter-spacing: .14em; color: var(--mu); }
  .ln { display: flex; gap: 10px; padding: 10px 0; border-top: 1.5px dashed #DFDFE4; font-size: 15px; font-weight: 700; }
  .ln .n { flex: 1; min-width: 0; overflow-wrap: anywhere; } .ln .v { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; margin-top: 2px; border-top: 2.5px solid var(--tx); font: 800 17px/1 var(--ft); }
  .tot b { font-size: 32px; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .bt { display: block; width: 100%; height: 58px; border-radius: 18px; background: var(--pri); color: #fff; font: 800 20px/1 var(--ft); padding-top: .12em; margin-top: 14px; box-shadow: 0 8px 22px rgba(255, 90, 0, .3); }
  .bt:disabled { opacity: .6; }
  .bt.sec { background: #fff; color: var(--tx); border: 1.5px solid var(--s4); box-shadow: none; height: 50px; font-size: 16px; }
  .nota { margin-top: 14px; font-size: 14px; font-weight: 600; line-height: 1.5; color: var(--mu2); text-align: center; }
  .erro { color: #C2410C; font-weight: 800; }
  #pix { margin-top: 16px; background: #fff; border-radius: 18px; border: 1.5px solid var(--s4); padding: 18px 16px; text-align: center; }
  #pix h2 { margin: 0; font: 800 22px/1.1 var(--ft); }
  #pix img { display: block; width: min(250px, 78%); aspect-ratio: 1; margin: 12px auto 0; image-rendering: pixelated; }
  #copia { margin-top: 10px; padding: 10px; border-radius: 12px; background: var(--bg); font: 600 11.5px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--mu2); overflow-wrap: anywhere; max-height: 5.6em; overflow: hidden; text-align: left; }
  #selo { margin: 18px auto 0; width: 96px; height: 96px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; }
  #selo svg { width: 52%; height: 52%; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; height: calc(52px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--pri); display: grid; place-items: center; }
  footer img { height: 22px; }
</style>
</head>
<body>
<main>
  <div class="loja" id="loja">Minha comanda</div>
  <div class="rot" id="rot">Carregando…</div>

  <div class="papel" id="papel" hidden>
    <div class="num"><small>COMANDA</small><span id="num"></span></div>
    <div id="itens"></div>
    <div class="tot"><span>Total</span><b id="total"></b></div>
  </div>

  <div id="paga" hidden><div id="selo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><p class="nota" style="font-size:17px;color:var(--tx);font-weight:800">Comanda paga. Obrigado!</p></div>

  <div id="pix" hidden>
    <h2>Pague com Pix</h2>
    <img id="pix-img" alt="QR Code do Pix">
    <div id="copia"></div>
    <button type="button" class="bt" id="b-copiar">Copiar o código Pix</button>
    <p class="nota" id="pix-estado">Depois de pagar, esta tela confirma sozinha.</p>
  </div>

  <button type="button" class="bt" id="b-pagar" hidden>Pagar com Pix</button>
  <p class="nota" id="nota"></p>
  <button type="button" class="bt sec" id="b-atualizar" hidden>Atualizar</button>
</main>
<footer><img src="livefood-logo-branca.png" alt="livefood"></footer>

<script>
(function () {
  'use strict';
  var API = 'https://giro-os-api.nucleofull.workers.dev', Q = new URLSearchParams(location.search);
  var L = (Q.get('l') || '').replace(/[^A-Za-z0-9_-]/g, ''), N = (Q.get('n') || '').replace(/\D/g, ''), T = (Q.get('t') || '').replace(/[^a-f0-9]/g, '');
  var $ = function (id) { return document.getElementById(id); };
  var real = function (v) { return 'R$ ' + (Number(v) || 0).toFixed(2).replace('.', ','); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var relogio = 0, copia = '';

  function pinta(d) {
    $('loja').textContent = d.loja || 'Minha comanda';
    $('num').textContent = d.num;
    $('rot').textContent = d.paga ? 'Comanda paga' : d.aberta ? 'Comanda em aberto' : 'Comanda fechada';
    $('papel').hidden = !d.aberta; $('paga').hidden = !d.paga;
    $('itens').innerHTML = (d.linhas || []).map(function (l) { return '<div class="ln"><div class="n">' + (l.q > 1 ? l.q + 'x ' : '') + esc(l.n) + '</div><div class="v">' + real(l.v) + '</div></div>'; }).join('');
    $('total').textContent = real(d.total);
    var pend = d.aberta && d.conta && d.conta.pix_copia;
    $('pix').hidden = !pend;
    if (pend) { copia = d.conta.pix_copia; $('pix-img').src = 'data:image/png;base64,' + d.conta.pix_qr; $('copia').textContent = copia; }
    $('b-pagar').hidden = !(d.aberta && d.pix && !pend);
    $('b-atualizar').hidden = !d.aberta || pend;
    $('nota').className = 'nota';
    $('nota').textContent = d.paga ? '' : !d.aberta ? 'Esta comanda já foi fechada no caixa.' : pend ? '' : d.pix ? 'Ou pague no caixa, apresentando a comanda impressa.' : 'Pague no caixa, apresentando a comanda impressa.';
    clearTimeout(relogio);
    if (pend) relogio = setTimeout(carrega, 3000);   // com Pix gerado, confere o pagamento sozinho
  }
  function falha(m) { $('rot').textContent = ''; $('nota').className = 'nota erro'; $('nota').textContent = m; $('b-atualizar').hidden = false; }
  function carrega() {
    if (!L || !N || !T) return falha('Link da comanda incompleto. Aponte a câmera para o QR da comanda de novo.');
    fetch(API + '/live/conta?l=' + encodeURIComponent(L) + '&n=' + N + '&t=' + T, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) return falha(d.mensagem || 'Não consegui abrir a comanda.');
      pinta(d);
    }).catch(function () { falha('Sem conexão. Toque em Atualizar.'); });
  }
  $('b-pagar').onclick = function () {
    var b = this; b.disabled = true; b.textContent = 'Gerando o Pix…';
    fetch(API + '/live/conta-pix', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ l: L, n: N, t: T }) }).then(function (r) { return r.json(); }).then(function (d) {
      b.disabled = false; b.textContent = 'Pagar com Pix';
      if (!d.ok) { $('nota').className = 'nota erro'; $('nota').textContent = d.mensagem || 'Não consegui gerar o Pix. Pague no caixa.'; return; }
      carrega();
    }).catch(function () { b.disabled = false; b.textContent = 'Pagar com Pix'; $('nota').className = 'nota erro'; $('nota').textContent = 'Sem conexão. Tente de novo.'; });
  };
  $('b-copiar').onclick = function () {
    var b = this, ok = function () { b.textContent = 'Código copiado'; setTimeout(function () { b.textContent = 'Copiar o código Pix'; }, 2500); };
    try { navigator.clipboard.writeText(copia).then(ok, function () { $('pix-estado').textContent = 'Segure o dedo sobre o código acima para copiar.'; }); } catch (e) { $('pix-estado').textContent = 'Segure o dedo sobre o código acima para copiar.'; }
  };
  $('b-atualizar').onclick = carrega;
  document.addEventListener('visibilitychange', function () { if (!document.hidden) carrega(); });   // voltou do aplicativo do banco: confere na hora
  carrega();
})();
</script>
</body>
</html>
