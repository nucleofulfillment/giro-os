  if(x.foto){ segs(6); if(l.length>1) S.abT=setTimeout(prox,6000); }
  else { var v=m.querySelector('video'); segs(8); el('abS').hidden=false; v.muted=!S.som||S.somTrava; v.onloadedmetadata=function(){ if(isFinite(v.duration)&&v.duration>0) segs(Math.min(v.duration,30)); }; v.onended=prox; v.onerror=function(){ S.abT=setTimeout(prox,400); };
    try{ var p=v.play(); if(p&&p.catch) p.catch(function(er){ if(!er||er.name!=='NotAllowedError'||v.muted) return; v.muted=true; S.somTrava=true; somPinta(); v.play().catch(function(){}); }); }catch(e){} if(l.length>1) S.abT=setTimeout(prox,31000); }
  if(x.foto) el('abS').hidden=true; somPinta();

/* (186) som dos vídeos da abertura, igual às ofertas do cardápio: começa sem som; tocou no alto-falante, liga e vale para os próximos.

function trocaSom(){ var v=el('abM')&&el('abM').querySelector('video'); S.som=!(S.som&&!S.somTrava); S.somTrava=false; try{ sessionStorage.setItem('fest_som',S.som?'1':''); }catch(e){}

/* (188) como nos stories: tocar na direita passa para o próximo, na esquerda volta. Comprar fica no botão */

/* ---------- evento: abre na hora com o que já veio da agenda; os ingressos chegam logo depois ---------- */
/* (186) o evento começa a carregar quando o dedo encosta no cartão, e fica guardado por 45 segundos */
var EVC={};
function evBusca(id){ var c=EVC[id]; if(c&&Date.now()-c.t<45000) return c.p; var p=api('/fest/evento/'+encodeURIComponent(id)+(CASA?'?casa='+encodeURIComponent(CASA):'')); c=EVC[id]={t:Date.now(),p:p}; p.then(function(d){ if(d&&d.ok) c.d=d; else delete EVC[id]; }); return p; }
function evento(id){
  /* (187) o link pode trazer o código ou o nome do evento (livefest/<casa>/<nome>) */
  var pre=S.ag.filter(function(e){ return e.id===id||e.slug===id; })[0], rid=pre?pre.id:id, novo=!S.ev||(S.ev.id!==rid&&S.ev.slug!==id), c=EVC[id];
  if(novo){ S.car={}; S.mesas={}; S.sal=0; }
  if(c&&c.d&&Date.now()-c.t<45000){ S.ev=c.d.evento; if(S.sal>=S.ev.saloes.length) S.sal=0; eventoPinta(); m3Prepara(); return; }
  /* (188) a agenda já traz os ingressos: o evento abre completo na hora e só confere por trás */
  if(novo) S.ev=pre?Object.assign({},pre,{saloes:Array.isArray(pre.saloes)?pre.saloes:null}):null;
  if(S.ev){ eventoPinta(); if(S.ev.saloes) m3Prepara(); } else tela('<div class="vazio">Carregando...</div>','evento');
  evBusca(id).then(function(d){
    if(S.tela!=='evento'||(d.ok&&S.ev&&S.ev.id!==d.evento.id)) return;
    if(!d.ok){ tela('<div class="bar">'+voltar('agenda()')+'<b>Evento</b></div><div class="vazio">'+esc(d.mensagem||'Evento não encontrado.')+'</div>','evento'); return; }
    var igual=S.ev&&S.ev.saloes&&JSON.stringify(S.ev.saloes)===JSON.stringify(d.evento.saloes); S.ev=d.evento; if(S.sal>=S.ev.saloes.length) S.sal=0; if(!igual){ eventoPinta(true); m3Prepara(); }
  });
}

  try{ localStorage.setItem(CK,JSON.stringify({eventos:S.ag,abertura:S.sl,casa:S.casa})); }catch(e){}
  if(ja&&antes===JSON.stringify([S.ag,S.sl,S.casa])) return;
  if(S.tela==='abertura') abertura(); else if(S.tela==='agenda') agenda();
});
