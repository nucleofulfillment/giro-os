<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>LiveFace · Entrada</title>
<link rel="icon" type="image/svg+xml" href="/site/img/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* (173) LiveFace 1B: tablet da entrada. A lista do evento fica no aparelho, criptografada, e continua funcionando sem internet depois de baixada. */
:root{--laranja:#FF5A00;--laranja-claro:#FF8A33;--laranja-escuro:#E04A00;--preto:#0B0908;--grafite:#141010;--grafite-2:#1D1715;--grafite-3:#2A221F;--linha:rgba(255,255,255,.1);--linha-forte:rgba(255,255,255,.2);--texto:#F7F2EE;--suave:#B3A79E;--ok:#2BC46A;--alerta:#FFB020;--titulo:'Baloo 2',system-ui,sans-serif;--corpo:'Nunito',system-ui,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--preto);color:var(--texto);font:600 16px/1.4 var(--corpo);overflow:hidden}
[hidden]{display:none!important}
h1,h2,p{margin:0}
h1,h2{font-family:var(--titulo);font-weight:800;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--laranja-claro);outline-offset:3px;border-radius:8px}
.app{height:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column}
.cen{flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:max(20px,env(safe-area-inset-top)) 22px 22px}
.marca{font:800 26px/1 var(--titulo);letter-spacing:-.03em}.marca b{color:var(--laranja);font-weight:800}
.bt{border:0;border-radius:99px;min-height:54px;padding:0 22px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.bt-pri{background:linear-gradient(135deg,var(--laranja-claro),var(--laranja) 55%,var(--laranja-escuro));color:#fff}
.bt-sec{background:transparent;border:1.5px solid var(--linha-forte)}
.mut{color:var(--suave)}
.ev{display:flex;align-items:center;gap:12px;background:var(--grafite-2);border:1px solid var(--linha);border-radius:16px;padding:14px;width:100%;text-align:left}
.ev div{flex:1;min-width:0}.ev b{font-weight:800;display:block}.ev small{color:var(--suave)}
.barra{height:10px;border-radius:9px;background:var(--grafite-3);overflow:hidden}.barra i{display:block;height:100%;width:0;background:var(--laranja);transition:width .3s}
.visor{position:relative;flex:1;min-height:0;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;--cor:var(--laranja)}
.visor[data-e="ok"]{--cor:var(--ok)}.visor[data-e="alerta"]{--cor:var(--alerta)}
.visor video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.oval{position:relative;height:72%;aspect-ratio:1/1.26;max-width:80%;border-radius:50%;border:5px solid var(--cor);box-shadow:0 0 0 3000px rgba(11,9,8,.5);transition:border-color .25s}
.conta{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 min(34vw,190px)/1 var(--titulo);color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.7);pointer-events:none}
.conta.bate{animation:bate .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bate{from{transform:scale(1.35);opacity:.3}to{transform:none;opacity:1}}
.topo{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;gap:8px;z-index:2}
.tag{background:rgba(11,9,8,.8);border:1px solid var(--linha-forte);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}.tag.off i{background:var(--alerta)}
.topo .esp{flex:1}
.ib{background:rgba(11,9,8,.8);border:1px solid var(--linha-forte);border-radius:99px;min-height:40px;padding:0 13px;font-size:13px;font-weight:800;text-decoration:none;color:inherit;display:flex;align-items:center;white-space:nowrap}
.selo{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--preto);border:1px solid var(--cor);color:var(--cor);border-radius:99px;padding:7px 16px;font-weight:800;font-size:14.5px;white-space:nowrap;z-index:2}
.diag{position:absolute;left:14px;bottom:56px;background:rgba(0,0,0,.8);font:700 12px/1.4 ui-monospace,monospace;padding:6px 8px;border-radius:8px;z-index:2}
.lado{flex:none;height:42%;min-height:300px;background:var(--grafite-2);padding:18px 24px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;overflow:auto}
.lv{display:flex;align-items:center;gap:12px}.lv-p{flex:none;width:112px}
.balao{position:relative;background:#fff;color:#1B1412;font-weight:800;font-size:15.5px;line-height:1.35;border-radius:16px;padding:10px 14px;min-height:48px;display:flex;align-items:center;flex:1;min-width:0}
.balao::before{content:'';position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right-color:#fff}
.live-mascote{position:relative;width:100%;aspect-ratio:220/230}.live-corpo{position:absolute;inset:0;transform-origin:50% 46%;will-change:transform}.live-corpo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 18px rgba(255,90,0,.25))}.live-rosto{position:absolute;border-radius:14% / 18%}.live-sombra{position:absolute;left:22%;right:22%;bottom:-6%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent)}
.res{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.est{display:flex;align-items:center;gap:10px;font:800 34px/1.05 var(--titulo)}.est.ok{color:var(--ok)}.est.aten{color:var(--alerta)}
.nome{font:800 28px/1.1 var(--titulo)}
.catraca{margin-top:auto;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;border:1px solid var(--linha);border-radius:14px;padding:11px 13px}
.catraca i{width:11px;height:11px;border-radius:50%;background:var(--alerta);flex:none}.catraca.aberta i{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.acoes{display:flex;gap:8px;flex-wrap:wrap}.acoes .bt{flex:1;min-height:46px;font-size:14.5px;padding:0 14px;white-space:nowrap}
.painel{position:absolute;inset:0;background:var(--grafite);z-index:5;display:flex;flex-direction:column;gap:12px;padding:max(18px,env(safe-area-inset-top)) 20px 20px;overflow:auto}
.painel input,.painel select{min-height:54px;border-radius:14px;border:1.5px solid var(--linha-forte);background:var(--grafite-2);color:var(--texto);font:700 17px var(--corpo);padding:0 14px;width:100%}
.pes{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linha)}.pes div{flex:1;min-width:0}.pes b{font-weight:800}.pes small{display:block;color:var(--suave)}
.pes .bt{min-height:42px;font-size:14px;padding:0 14px;flex:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script src="site/js/live-mascote.js"></script>
<script>
(function(){
  'use strict';
  var API='https://giro-os-api.nucleofull.workers.dev', VER='3.3.6', BASE='https://cdn.jsdelivr.net/npm/@vladmandic/human@'+VER+'/';
  var Q=new URLSearchParams(location.search), LOCAL=/^(localhost|127\.)/.test(location.hostname);
  var SAI=Q.get('modo')==='saida', saiTimer=null; if(SAI) document.title='LiveFace · Saída';
  var TK=''; try{ TK=localStorage.getItem('dd_jwt')||''; }catch(e){}
  /* Calibragem: a semelhança vai de 0 a 1. ?diag=1 mostra os números na tela para ajustar no local do evento */
  var LIM={sim:.6,margem:.05,quadros:2,minBox:.12,yaw:.6,vivo:.4,msContagem:3000,msPerde:2500,msSemMatch:3000,msPassando:25000,msRes:3500,msErro:4500};
  var DIAG=Q.get('diag')==='1', SEM_VIVO=LOCAL&&Q.get('semvivo')==='1';
  var RACHA=null, EV=null, PES=[], POR={}, ENT={}, FILA=[], H=null, stream=null, rodando=false, pausa=0, cand=null, candN=0, falhas=0, live=null, wake=null, timers=[];
  var $=function(i){ return document.getElementById(i); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function hdr(){ return {'Content-Type':'application/json','Authorization':'Bearer '+TK}; }
  function api(c,b){ return fetch(API+c,b?{method:'POST',headers:hdr(),body:JSON.stringify(b)}:{headers:hdr(),cache:'no-store'}).then(function(r){ if(r.status===401){ sessaoAcabou(); throw new Error('sessao'); } return r.json(); }); }
  function sessaoAcabou(){ if(!PES.length) location.href='hub.html'; }
  function hoje(){ return new Date(Date.now()-3*3600000).toISOString().slice(0,10); }
  function hora(t){ var d=new Date(t); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  function dataBr(i){ i=String(i||''); return i.slice(8,10)+'/'+i.slice(5,7)+'/'+i.slice(0,4); }

  /* ---------- lista guardada no aparelho, criptografada com chave que não sai dele ---------- */
  function idb(){ return new Promise(function(ok,no){ var r=indexedDB.open('liveface',1); r.onupgradeneeded=function(){ r.result.createObjectStore('k'); }; r.onsuccess=function(){ ok(r.result); }; r.onerror=function(){ no(r.error); }; }); }
  function iGet(k){ return idb().then(function(d){ return new Promise(function(ok,no){ var q=d.transaction('k').objectStore('k').get(k); q.onsuccess=function(){ ok(q.result); }; q.onerror=function(){ no(q.error); }; }); }); }
  function iSet(k,v){ return idb().then(function(d){ return new Promise(function(ok,no){ var t=d.transaction('k','readwrite'); t.objectStore('k').put(v,k); t.oncomplete=function(){ ok(); }; t.onerror=function(){ no(t.error); }; }); }); }
  function iDel(k){ return idb().then(function(d){ return new Promise(function(ok){ var t=d.transaction('k','readwrite'); t.objectStore('k').delete(k); t.oncomplete=function(){ ok(); }; t.onerror=function(){ ok(); }; }); }); }
  function chave(){ return iGet('chave').then(function(c){ if(c) return c; return crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']).then(function(n){ return iSet('chave',n).then(function(){ return n; }); }); }); }
  function guarda(){ return chave().then(function(c){ var iv=crypto.getRandomValues(new Uint8Array(12)); var o=JSON.stringify({ev:EV,pes:PES.map(function(p){ return {id:p.id,nome:p.nome,tipo:p.tipo,dim:p.dim,b:p.b}; })}); return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},c,new TextEncoder().encode(o)).then(function(buf){ return iSet('lista',{iv:iv,buf:buf,fim:EV.fim,id:EV.id}); }); }); }
  function apagaLista(){ return iDel('lista').then(function(){ try{ localStorage.removeItem('lf_fila'); }catch(e){} }); }
  function carregaGuardada(){ return iGet('lista').then(function(l){ if(!l) return null; if(l.fim<new Date(Date.now()-3*3600000-86400000).toISOString().slice(0,10)){ return apagaLista().then(function(){ return null; }); } return chave().then(function(c){ return crypto.subtle.decrypt({name:'AES-GCM',iv:l.iv},c,l.buf); }).then(function(b){ return JSON.parse(new TextDecoder().decode(b)); }); }).catch(function(){ return null; }); }
  function deB64(b,dim){ var s=atob(b), n=s.length/2, a=new Int16Array(n), i; for(i=0;i<n;i++){ var v=s.charCodeAt(i*2)|(s.charCodeAt(i*2+1)<<8); a[i]=v>32767?v-65536:v; } var out=[]; for(i=0;i+dim<=n;i+=dim){ var f=new Array(dim),j; for(j=0;j<dim;j++) f[j]=a[i+j]/10000; out.push(f); } return out; }
  function preparaPessoas(l){ PES=l; POR={}; PES.forEach(function(p){ POR[p.id]=p; p.vet=p.b?deB64(p.b,p.dim):[]; }); }

  /* ---------- 1. escolher o evento e baixar ---------- */
  function telaEventos(){
    $('app').innerHTML='<div class="cen"><div class="marca">live<b>face</b></div><h1 style="font-size:32px">'+(SAI?'Tablet da saída':'Tablet da entrada')+'</h1><p class="mut">Escolha o evento. A lista fica guardada neste aparelho e funciona mesmo se a internet cair.</p><div id="evs" class="mut">Carregando...</div><a class="bt bt-sec" href="hub.html">Voltar ao Hub</a></div>';
    if(!TK){ location.href='hub.html'; return; }
    api('/painel/lf-eventos').then(function(d){
      if(!d||!d.ok){ $('evs').textContent=(d&&d.mensagem)||'Não consegui carregar os eventos.'; return; }
      var l=(d.eventos||[]).filter(function(e){ return e.fim>=hoje(); });
      $('evs').innerHTML=l.length?l.map(function(e){ return '<button class="ev" style="margin-bottom:8px" data-id="'+esc(e.id)+'"><div><b>'+esc(e.nome)+'</b><small>até '+dataBr(e.fim)+' · '+e.rostos+' rosto'+(e.rostos==1?'':'s')+' de '+e.ingressos+' ingresso'+(e.ingressos==1?'':'s')+'</small></div><span aria-hidden="true">→</span></button>'; }).join(''):'Nenhum evento em andamento. Crie em Painel > Configurações > LiveFace.';
      Array.prototype.forEach.call($('evs').querySelectorAll('[data-id]'),function(b){ b.onclick=function(){ baixa(l.filter(function(e){ return e.id===b.dataset.id; })[0]); }; });
    }).catch(function(e){ if(e.message!=='sessao') $('evs').textContent='Sem conexão. Verifique a internet.'; });
  }
  function baixaTudo(id){
    var acc=[], pag=function(apos){ return api('/painel/lf-lista?ev='+encodeURIComponent(id)+'&apos='+encodeURIComponent(apos||'')).then(function(d){ if(!d||!d.ok) throw new Error((d&&d.mensagem)||'Não consegui baixar a lista.'); acc=acc.concat(d.pessoas||[]); if($('bar')) $('bar').style.width=Math.min(90,Math.round(acc.length/Math.max(1,d.total)*90))+'%'; return d.prox?pag(d.prox):acc; }); };
    return pag('');
  }
  /* quem se cadastra depois entra na lista sozinho: atualiza ao abrir e a cada 2 minutos. Sem internet, segue com a lista guardada */
  function atualizaLista(){ if(!EV||!PES.length&&!rodando) return Promise.resolve(); return baixaTudo(EV.id).then(function(acc){ preparaPessoas(acc); pintaQt(); return guarda(); }).catch(function(){}); }
  function qtRostos(){ return PES.filter(function(p){ return p.vet&&p.vet.length; }).length; }
  function pintaQt(){ var q=$('qt'); if(!q) return; var n=qtRostos(); q.textContent=n+(n===1?' rosto':' rostos'); q.classList.toggle('off',!n); }
  function baixa(ev){
    EV={id:ev.id,nome:ev.nome,fim:ev.fim};
    $('app').innerHTML='<div class="cen"><div class="marca">live<b>face</b></div><h1 style="font-size:30px">'+esc(ev.nome)+'</h1><p class="mut" id="st">Baixando a lista do evento...</p><div class="barra"><i id="bar"></i></div></div>';
    baixaTudo(ev.id).then(function(acc){ preparaPessoas(acc); return guarda(); }).then(function(){ return comeca(); }).catch(function(e){ if(e.message==='sessao') return; if($('st')) $('st').textContent=e.message||'Não consegui baixar.'; });
  }
  /* ---------- leitor ---------- */
  function carregaLeitor(){
    if(H) return Promise.resolve(H);
    return new Promise(function(ok,no){ var s=document.createElement('script'); s.src=BASE+'dist/human.js'; s.onload=ok; s.onerror=function(){ no(new Error('Não consegui carregar o leitor de rosto.')); }; document.head.appendChild(s); }).then(function(){
      var C=window.Human&&(Human.Human||Human.default||Human);
      H=new C({modelBasePath:BASE+'models/',backend:'webgl',debug:false,async:true,cacheSensitivity:0,filter:{enabled:false},gesture:{enabled:false},body:{enabled:false},hand:{enabled:false},object:{enabled:false},segmentation:{enabled:false},face:{enabled:true,detector:{maxDetected:2,rotation:false,return:false},mesh:{enabled:true},iris:{enabled:false},description:{enabled:true},emotion:{enabled:false},antispoof:{enabled:!SEM_VIVO},liveness:{enabled:!SEM_VIVO}}});
      return H.load().then(function(){ return H.warmup?H.warmup():null; }).then(function(){ return H; });
    });
  }
  /* compara com a lista: melhor pessoa e a distância para a segunda, para não confundir parecidos */
  function procura(v){
    var m1=0,m2=0,q=null,i,j;
    for(i=0;i<PES.length;i++){ var p=PES[i],b=0; for(j=0;j<p.vet.length;j++){ var s=H.match.similarity(v,p.vet[j]); if(s>b) b=s; } if(b>m1){ m2=m1; m1=b; q=p; } else if(b>m2) m2=b; }
    return {p:q,sim:m1,seg:m2,ok:!!q&&m1>=LIM.sim&&(m1-m2)>=LIM.margem};
  }
  /* ---------- 2. tela de reconhecimento ---------- */
  function montaTela(){
    $('app').innerHTML='<div class="visor" id="vis" data-e="busca"><video id="vid" playsinline autoplay muted></video><div class="oval"><span class="conta" id="conta" hidden></span></div>'+
      '<div class="topo"><span class="tag" id="rede"><i></i><span id="redet">Online</span></span><span class="tag">'+esc(EV.nome)+'</span><span class="tag" id="qt"></span><span class="esp"></span><button class="ib" id="bmenu">Menu</button></div>'+
      '<span class="selo" id="selo">Olhe para a câmera</span>'+(DIAG?'<div class="diag" id="diag"></div>':'')+'</div>'+
      '<div class="lado"><div class="lv"><div class="lv-p" id="lv"></div><p class="balao" id="balao" aria-live="polite"></p></div><div class="res" id="res"></div></div><div id="over"></div>';
    try{ if(window.LiveMascote) live=LiveMascote.criar($('lv'),{rotulo:'Live'}); }catch(e){}
    $('bmenu').onclick=menu; pintaQt();
  }
  function diz(t,o){ o=o||{}; var b=$('balao'); if(b) b.textContent=t; if(!live) return; try{ if(o.expr) live.expressao(o.expr); if(o.gesto) live.gesto(o.gesto); }catch(e){} }
  function setVis(e,s){ var v=$('vis'); if(v) v.dataset.e=e; var x=$('selo'); if(x) x.textContent=s; }
  function catraca(a,t){ return '<div class="catraca '+(a?'aberta':'')+'"><i></i>'+esc(t)+'</div>'; }
  function aguardando(){
    RACHA=null; contaPara(); setVis('busca','Olhe para a câmera'); pausa=0; cand=null; candN=0; falhas=0;
    $('res').innerHTML='<h2 style="font-size:30px">Pare em frente à câmera</h2><p class="mut">'+(SAI?'Eu confiro sua conta e libero a saída.':'A catraca abre sozinha quando eu reconhecer você.')+'</p><div class="acoes" style="margin-top:6px"><button class="bt bt-sec" id="beq">Equipe: buscar por nome</button></div>'+catraca(false,SAI?'Catraca de saída aguardando':'Catraca de entrada aguardando');
    $('beq').onclick=busca; diz('Oi! Olha aqui para mim.',{expr:'feliz'});
  }
  /* (173) catraca: quando o relé for escolhido, a abertura real entra aqui. Sem relé, a equipe libera vendo a tela */
  function abreCatraca(){ try{ if(window.LiveFaceCatraca&&LiveFaceCatraca.abrir) LiveFaceCatraca.abrir(); }catch(e){} }
  function registra(p,met,sim){ var t=Date.now(); ENT[p.id]={t:t,metodo:met}; FILA.push({id:p.id,t:t,metodo:met,sim:sim?Math.round(sim*100)/100:0}); salvaFila(); sincroniza(); }
  function libera(p,met,sim){
    pausa=Date.now()+LIM.msRes; registra(p,met,sim); abreCatraca();
    setVis('ok','Liberado');
    $('res').innerHTML='<div class="est ok">✓ Liberado</div><div class="nome">Boas-vindas, '+esc(String(p.nome).split(' ')[0])+'!</div><p class="mut">'+(p.comanda?'Comanda '+esc(p.comanda)+' aberta · ':'')+esc(p.tipo||'Ingresso')+' · '+(met==='rosto'?'pelo rosto':(met==='qr'?'pelo QR code':'liberado pela equipe'))+'</p>'+catraca(true,'Catraca de entrada liberada');
    diz('Boa festa, '+String(p.nome).split(' ')[0]+'!',{gesto:'boas_vindas'});
    agenda(LIM.msRes,aguardando);
  }
  function jaEntrou(p){
    pausa=Date.now()+LIM.msErro; setVis('alerta','Já entrou');
    $('res').innerHTML='<div class="est aten">! Este ingresso já entrou</div><div class="nome">'+esc(String(p.nome).split(' ')[0])+'</div><p class="mut">Entrada registrada às '+hora(ENT[p.id].t)+'. Se precisar, a equipe libera.</p><div class="acoes"><button class="bt bt-sec" id="bfor">Equipe: liberar mesmo assim</button></div>'+catraca(false,'Catraca de entrada fechada');
    $('bfor').onclick=function(){ libera(p,'equipe'); };
    diz('Esse ingresso já passou por aqui. Chame a equipe.',{gesto:'confuso'});
    agenda(LIM.msErro,aguardando);
  }
  function naoReconheceu(m){
    pausa=Date.now()+LIM.msErro; setVis('alerta','Não reconhecido');
    $('res').innerHTML='<div class="est aten">! '+esc(m||'Não reconheci')+'</div><p class="mut">Tire o boné ou os óculos e olhe de novo. Ou mostre o QR code do ingresso aqui na câmera.</p><div class="acoes"><button class="bt bt-sec" id="beq">Equipe: buscar por nome</button></div>'+catraca(false,'Catraca de entrada fechada');
    $('beq').onclick=busca; diz('Ops, não consegui ver direito. Vamos de novo?',{gesto:'confuso'});
    agenda(LIM.msErro,aguardando);
  }
