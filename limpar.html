<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limpar pedidos · LiveFood</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="site/img/favicon-admin.svg"><link rel="icon" type="image/png" sizes="32x32" href="site/img/icone-admin-32.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#F6F1EC;color:#29231E;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:24px 16px}
.cx{max-width:520px;margin:0 auto;background:#fff;border:1px solid #E7DED6;border-radius:16px;padding:22px}
h1{font-size:21px;margin:0 0 4px}.mut{color:#7A6E66;margin:0 0 16px}
table{width:100%;border-collapse:collapse;margin:8px 0 16px}td{padding:7px 4px;border-bottom:1px solid #F0E8E1}td:last-child{text-align:right;font-weight:700}
.tot td{border:0;font-size:16px}
.av{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:14px}
.ok{background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46;border-radius:10px;padding:10px 12px;font-size:14px}
input{width:100%;padding:11px 12px;border:1px solid #D9CEC5;border-radius:10px;font:inherit;margin:0 0 10px;text-transform:uppercase}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#B91C1C;color:#fff;font:700 15px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
a{color:#FF5A00}
</style></head><body>
<div class="cx" id="cx"><p class="mut">Carregando…</p></div>
<script>
var API='https://giro-os-api.nucleofull.workers.dev';
var NOMES={food_pedidos:'Pedidos',giro_comandas:'Comandas',food_mesa_contas:'Contas de mesa',food_mesa_partes:'Partes da conta (racha)',food_fech:'Fechamentos',food_impressao:'Fila de impressão',giro_contador:'Numeração dos pedidos',food_chamados:'Chamados de garçom',whats_msgs:'Mensagens do WhatsApp',whats_arq:'Arquivos do WhatsApp',wap_conv:'Conversas de pedido no WhatsApp',whats_envios:'Registro de envios do WhatsApp'};
var TK='';try{TK=localStorage.getItem('lf_admin_jwt')||'';}catch(e){}
var loja=(new URLSearchParams(location.search).get('loja')||'').trim();
var cx=document.getElementById('cx');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function chamar(m,corpo){return fetch(API+'/admin/clientes/'+encodeURIComponent(loja)+'/limpar-pedidos',{method:m,cache:'no-store',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TK},body:corpo?JSON.stringify(corpo):undefined}).then(function(r){return r.json().catch(function(){return {};}).then(function(d){d._st=r.status;return d;});});}
function tabela(q){var h='<table>',t=0;Object.keys(q).forEach(function(k){t+=Number(q[k])||0;h+='<tr><td>'+esc(NOMES[k]||k)+'</td><td>'+esc(q[k])+'</td></tr>';});return h+'<tr class="tot"><td>Total</td><td>'+t+'</td></tr></table>';}
function carregar(){
  if(!loja){cx.innerHTML='<h1>Limpar pedidos</h1><p class="mut">Abra com o nome da loja no endereço, por exemplo: <b>limpar.html?loja=cinquenta</b></p>';return;}
  if(!TK){cx.innerHTML='<h1>Limpar pedidos</h1><p class="mut">Entre primeiro no <a href="admin.html">admin</a> e depois abra esta página de novo.</p>';return;}
  chamar('GET').then(function(d){
    if(d._st===401||d._st===403){cx.innerHTML='<h1>Limpar pedidos</h1><p class="mut">Sessão do admin vencida. Entre no <a href="admin.html">admin</a> e volte aqui.</p>';return;}
    if(!d.ok){cx.innerHTML='<h1>Limpar pedidos</h1><p class="mut">'+esc(d.mensagem||('O servidor ainda não tem a limpeza (código '+d._st+(d.erro?' · '+d.erro:'')+'). Confira se o Worker 215 foi colado no Cloudflare.'))+'</p>';return;}
    cx.innerHTML='<h1>Limpar pedidos · '+esc(d.loja.nome)+'</h1><p class="mut">Deixa a loja como se a conta tivesse sido criada hoje: apaga só pedidos e WhatsApp.</p>'+tabela(d.registros)+
      '<div class="av">Não tem como desfazer. Cardápio, fotos, configurações, usuários, mesas, reservas e clientes cadastrados <b>não</b> são apagados.</div>'+
      '<input id="cf" placeholder="Digite LIMPAR para confirmar" autocomplete="off"><button id="bt" disabled>Apagar pedidos e mensagens</button>';
    var cf=document.getElementById('cf'),bt=document.getElementById('bt');
    cf.oninput=function(){bt.disabled=cf.value.trim().toUpperCase()!=='LIMPAR';};
    bt.onclick=function(){bt.disabled=true;bt.textContent='Apagando…';chamar('POST',{confirmar:cf.value}).then(function(r){
      if(!r.ok){bt.disabled=false;bt.textContent='Apagar pedidos e mensagens';alert(r.mensagem||'Não deu certo.');return;}
      var t=0;Object.keys(r.apagados||{}).forEach(function(k){t+=Number(r.apagados[k])||0;});
      cx.innerHTML='<h1>Pronto · '+esc(r.loja.nome)+'</h1><div class="ok">'+t+' registros apagados. A loja está zerada de pedidos e mensagens; o próximo pedido começa no número 1.</div>';
    }).catch(function(){bt.disabled=false;bt.textContent='Apagar pedidos e mensagens';});};
  }).catch(function(){cx.innerHTML='<h1>Limpar pedidos</h1><p class="mut">Sem conexão com o servidor.</p>';});
}
carregar();
</script></body></html>
