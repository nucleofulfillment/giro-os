#sheet .x{position:absolute;right:12px;top:12px}
#sheet .bd{padding:16px 18px 4px}
#sheet h3{margin:0 0 4px;font-size:21px}
#sheet .dd{color:var(--mut);font-size:13.5px;line-height:1.5;margin:6px 0 12px}
#sheet h4{margin:16px 0 6px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.ln{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.ln b{color:var(--pri2)}.ln span small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.nt{font-size:12px;color:var(--mut);margin-top:14px;line-height:1.5}
.ov{position:absolute;left:0;right:0;display:flex;flex-direction:column;gap:.5em;padding:0 1.2em;pointer-events:none;z-index:4;color:var(--ov-cor,#fff);font-family:inherit}
.ov.p-base{bottom:var(--ov-b,0)}.ov.p-topo{top:var(--ov-t,0)}.ov.p-centro{top:50%;transform:translateY(-50%)}
.ov.a-esq{align-items:flex-start;text-align:left}.ov.a-centro{align-items:center;text-align:center}.ov.a-dir{align-items:flex-end;text-align:right}
.ov-apoio{font-size:calc(.85em*var(--ov-apoio,1));font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.92;text-shadow:0 1px .5em #0008}
.ov-tit{font-size:calc(1.9em*var(--ov-tit,1));font-weight:900;line-height:1.08;text-shadow:0 .1em .6em #0008;overflow-wrap:anywhere}
.ov-btn{pointer-events:auto;display:inline-block;margin-top:.3em;text-decoration:none;font-weight:800;font-size:calc(1em*var(--ov-btn,1));padding:.7em 1.4em;border-radius:calc(var(--ov-raio,14)*.0625em);cursor:pointer}
.ov-btn.cheio{background:var(--ov-bf,#f97316);color:var(--ov-bt,#fff)}
.ov-btn.contorno{border:.09em solid var(--ov-bt,#fff);color:var(--ov-bt,#fff);background:transparent}
.ov-btn.link{color:var(--ov-bt,#fff);padding:.2em 0;text-decoration:underline}
#stage .ov{--ov-t:calc(84px + env(safe-area-inset-top));--ov-b:calc(172px + env(safe-area-inset-bottom));font-size:16px}
#omask{position:absolute;inset:0;pointer-events:none;z-index:3}
.ov.e-cair .ov-apoio,.ov.e-cair .ov-tit,.ov.e-cair .ov-btn{animation:ovCair .85s cubic-bezier(.2,1.3,.4,1) both}
.ov.e-lateral{--ox:-130%}.ov.e-lateral.a-dir{--ox:130%}
.ov.e-lateral .ov-apoio,.ov.e-lateral .ov-tit,.ov.e-lateral .ov-btn{animation:ovLado .7s cubic-bezier(.2,.9,.25,1) both}
.ov.e-zoom .ov-apoio,.ov.e-zoom .ov-tit,.ov.e-zoom .ov-btn{animation:ovZoom .65s cubic-bezier(.2,1.5,.4,1) both}
.ov.e-cair .ov-apoio,.ov.e-lateral .ov-apoio,.ov.e-zoom .ov-apoio{animation-delay:.05s}
.ov.e-cair .ov-tit,.ov.e-lateral .ov-tit,.ov.e-zoom .ov-tit{animation-delay:.25s}
.ov.e-cair .ov-btn,.ov.e-lateral .ov-btn,.ov.e-zoom .ov-btn{animation-delay:.5s}
.ov.pulso .ov-btn:not(.link){position:relative}
.ov.pulso .ov-btn:not(.link)::after{content:'';position:absolute;inset:0;border-radius:inherit;border:.18em solid var(--ov-bf,#f97316);animation:ovAnel 1.7s ease-out 1.4s infinite;pointer-events:none}
.ov.pulso .ov-btn.contorno::after{border-color:var(--ov-bt,#fff)}
@keyframes ovCair{0%{transform:translateY(-160%);opacity:0}55%{transform:translateY(10%);opacity:1}75%{transform:translateY(-4%)}100%{transform:none;opacity:1}}
@keyframes ovLado{from{transform:translateX(var(--ox,-130%));opacity:0}to{transform:none;opacity:1}}
@keyframes ovZoom{0%{transform:scale(.2);opacity:0}65%{transform:scale(1.1);opacity:1}100%{transform:none}}
@keyframes ovAnel{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.45,1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.ov *,.ov *::after{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <video class="vd" id="v0" muted playsinline preload="auto"></video>
  <video class="vd" id="v1" muted playsinline preload="auto"></video>
  <div id="omask"></div><div class="shade-t"></div><div class="shade-b"></div>
  <div id="top"><div id="segs"></div><div id="bar"><div id="emp"></div><button class="rb" id="bMenu" style="display:none" title="Cardápio" onclick="abreMenu()"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/></svg></button></div></div>
  <div id="ovbox"></div><div id="oft"></div>
  <div id="cards"></div>
  <button id="somc" onclick="alternaSom()"></button>
  <button id="mnb" onclick="abreMenu()"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/></svg><span>CARDÁPIO</span></button>
  <div id="vazio"><h2 id="vzT">Cardápio em breve</h2><p id="vzP">Ainda não há ofertas no ar. Volte daqui a pouco.</p></div>
</div>
<nav id="nav"><button id="nv-inicio" onclick="navIr('inicio')"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"/></svg><span>Início</span></button><button id="nv-busca" onclick="navIr('busca')"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Busca</span></button><button id="nv-pedidos" onclick="navIr('pedidos')"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>Pedidos</span></button><button id="nv-sac" onclick="navIr('sac')"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Sacola</span><i class="bg" id="nSac"></i></button><button id="nv-conta" onclick="navIr('conta')"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Conta</span></button></nav>
<div id="giro"><div>📱<br><b>Gire o celular</b><br><small>O cardápio funciona em pé</small></div></div>
<div id="ovl" onclick="fechaSheet()"></div>
<div id="sheet"></div><div id="toast"></div>

<script>
var API='https://giro-os-api.nucleofull.workers.dev';
var Q=new URLSearchParams(location.search), CLI=(Q.get('c')||Q.get('loja')||'').replace(/[^A-Za-z0-9_-]/g,'');
var SAC=[], LT=0, D={ofertas:[],produtos:{},empresa:''}, ordem=[], idx=-1, cur=0, vs=[document.getElementById('v0'),document.getElementById('v1')], somOn=false, tick=null, novoD=null;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function brl(n){return 'R$ '+Number(n||0).toFixed(2).replace('.',',');}
function desc(p,v){ var d=p.promo; if(!d||!(v>0)) return v; var r=d.tipo==='pct'?v*(1-d.valor/100):v-d.valor; return Math.max(0,Math.round(r*100)/100); }
function precoHtml(p,v){ var n=desc(p,v); return n<v?'<s class="de">'+brl(v)+'</s> '+brl(n):brl(v); }
function minPreco(p){ var r=minPreco0(p); var n=desc(p,r.min); return {min:n,orig:r.min,de:r.de}; }
function minPreco0(p){ var t=(p.tamanhos||[]).map(function(x){return x.preco;}).filter(function(x){return x>0;}); if(t.length) return {min:Math.min.apply(null,t),de:t.length>1}; return {min:p.preco||0,de:false}; }

/* ── instalar como app (manifest feito na hora, com o nome do restaurante) ── */
function manifesto(){
  try{
    var svg="data:image/svg+xml;utf8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='#f97316'/><text x='256' y='330' font-size='260' text-anchor='middle'>🍕</text></svg>");
    var m={name:D.empresa||'Cardápio',short_name:(D.empresa||'Cardápio').slice(0,12),start_url:location.href,display:'standalone',display_override:['fullscreen','standalone'],orientation:'portrait',background_color:'#0b0b0d',theme_color:'#0b0b0d',icons:[{src:svg,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
    var l=document.createElement('link'); l.rel='manifest'; l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})); document.head.appendChild(l);
  }catch(e){}
}

function carregar(primeira){
  if(!CLI){ vazio('Link incompleto','Falta o código do restaurante no endereço (?c=...).'); return Promise.resolve(); }
  return fetch(API+'/food/cardapio/'+encodeURIComponent(CLI)).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){ if(primeira) vazio('Cardápio não encontrado',(d&&d.mensagem)||'Confira o link.'); return; }
    if(primeira){ D=d; sacLer(); aplicaTema(); navOn('inicio'); document.title=(d.empresa||'Cardápio'); $('emp').innerHTML=((d.cfg&&d.cfg.logo)?'<img class="lg" src="'+API+'/food/foto/'+encodeURIComponent(d.cli||CLI)+'/_logo?v='+(d.cfg.v||0)+'" alt="'+esc(d.empresa)+'" onerror="this.outerHTML=\''+esc(d.empresa).replace(/'/g,'')+'\'">':esc(d.empresa))+'<small id="stt"></small>'; pintaStatus(); try{ if(!estaAberto()&&!sessionStorage.getItem('lf_fcm_'+(d.cli||CLI))){ sessionStorage.setItem('lf_fcm_'+(d.cli||CLI),'1'); setTimeout(abreFechado,600); } }catch(e){} manifesto(); iniciar(); }
    else novoD=d;
  }).catch(function(){ if(primeira) vazio('Sem conexão','Não consegui abrir o cardápio. Tente de novo.'); });
}
function vazio(t,p){ $('vzT').textContent=t; $('vzP').textContent=p; $('vazio').style.display='flex'; }

function iniciar(){
  ordem=D.ofertas.slice();
  if(!ordem.length){ vazio('Cardápio em breve','Ainda não há ofertas no ar. Volte daqui a pouco.'); return; }
  $('vazio').style.display='none'; mostraSom();
  segs(); idx=-1; cur=0; tocar(0,true);
}
function segs(){ var h='',i; for(i=0;i<ordem.length;i++) h+='<i><b id="sg'+i+'"></b></i>'; $('segs').innerHTML=h; }

function prepara(el,o){ if(el.getAttribute('data-o')===o.id&&el.getAttribute('src')) return; el.setAttribute('data-o',o.id); el.src=o.video; el.load(); }

function tocar(i,primeira){
  if(!ordem.length) return;
  idx=((i%ordem.length)+ordem.length)%ordem.length;
  var o=ordem[idx], v=vs[cur], outro=vs[1-cur];
  prepara(v,o); v.loop=(ordem.length===1); v.currentTime=0; v.muted=!somOn;
  var go=v.play(); if(go&&go.catch) go.catch(function(){ v.muted=true; somOn=false; atualizaSom(); v.play().catch(function(){}); });
  vs.forEach(function(x){ x.classList.toggle('on',x===v); });
  outro.pause();
  if(ordem.length>1){ var prox=ordem[(idx+1)%ordem.length]; prepara(outro,prox); }
  var ovh=ofOverlay(o.txt,o.id); $('ovbox').innerHTML=ovh||''; $('omask').style.background=ovh?ofMascara(o.txt):'';
  $('oft').textContent=ovh?'':(o.nome||'');
  cartoes(o);
  for(var k=0;k<ordem.length;k++){ var b=$('sg'+k); if(b) b.style.width=(k<idx?'100%':'0'); }
  v.onended=function(){ proximo(); };
  v.onerror=function(){ setTimeout(proximo,600); };
  atualizaSom();
}
function proximo(){
  if(novoD&&(idx+1)%ordem.length===0){ D=novoD; novoD=null; ordem=D.ofertas.slice(); segs(); if(!ordem.length){ vs.forEach(function(x){x.pause();}); vazio('Cardápio em breve','Ainda não há ofertas no ar.'); return; } cur=1-cur; tocar(0); return; }
  cur=1-cur; tocar(idx+1);
}
setInterval(function(){
  var v=vs[cur], b=$('sg'+idx); if(v&&ordem.length===1&&v.currentTime<LT-0.5){ var oo=ordem[0], hh=ofOverlay(oo.txt,oo.id); if(hh) $('ovbox').innerHTML=hh; } LT=v?v.currentTime:0; if(b&&v&&v.duration>0) b.style.width=Math.min(100,(v.currentTime/v.duration)*100)+'%';
},200);

function cartoes(o){
  var h='';
  o.produtos.forEach(function(id,k){
    var p=D.produtos[id]; if(!p) return; var pr=minPreco(p);
    h+='<div class="cd" style="animation-delay:'+(k*80)+'ms" onclick="abreSheet(\''+esc(id)+'\')">'
      +'<div class="ph" style="'+(p.foto?'background-image:url('+fotoUrl(p)+')':'')+'"></div>'
      +'<div style="min-width:0"><div class="nm">'+esc(p.nome)+'</div>'
      +(p.desc?'<div class="ds">'+esc(p.desc)+'</div>':'')
      +'<div class="pr">'+(pr.de?'<small>a partir de</small>':'')+(pr.orig>pr.min?'<s class="de">'+brl(pr.orig)+'</s> ':'')+brl(pr.min)+'</div></div></div>';
  });
  $('cards').innerHTML=h; $('cards').scrollLeft=0;
}

/* texto e botão sobre o vídeo (mesmo desenho do painel) */
function ofOverlay(t,oid){
  t=t||{}; if(!(t.apoio||t.titulo||t.botao)) return null;
  var v='--ov-cor:'+(t.cor||'#ffffff')+';--ov-tit:'+((t.escTitulo||100)/100)+';--ov-apoio:'+((t.escApoio||100)/100)+';--ov-btn:'+((t.btnEsc||100)/100)+';--ov-raio:'+(t.btnRaio==null?14:t.btnRaio)+';--ov-bf:'+(t.btnFundo||'#f97316')+';--ov-bt:'+(t.btnTexto||'#ffffff');
  return '<div class="ov p-'+(t.pos||'base')+' a-'+(t.alin||'esq')+' e-'+(t.efeito||'nenhum')+(t.pulso?' pulso':'')+'" style="'+v+'">'
    +(t.apoio?'<div class="ov-apoio">'+esc(t.apoio)+'</div>':'')+(t.titulo?'<div class="ov-tit">'+esc(t.titulo)+'</div>':'')
    +(t.botao?'<a class="ov-btn '+(t.btnEstilo||'cheio')+'" onclick="ofPedir(\''+esc(oid||'')+'\')">'+esc(t.botao)+'</a>':'')+'</div>';
}
function ofPedir(oid){
  var o=null; (D.ofertas||[]).forEach(function(x){ if(x.id===oid) o=x; });
  var ids=((o&&o.produtos)||[]).filter(function(id){ return D.produtos[id]; });
  if(ids.length===1){ abreSheet(ids[0]); return; }
  if(!ids.length){ abreMenu(); return; }
  var h='<div class="wh"><button class="bk" onclick="fechaSheet()">'+XI+'</button><b>'+esc((o&&o.nome)||'Oferta')+'</b></div><div class="wb">';
  ids.forEach(function(id){ var p=D.produtos[id], pr=minPreco(p), ft=p.foto?'<div class="th" style="width:56px;height:56px;border-radius:10px;background:#2a2a30 center/cover url('+fotoUrl(p)+');flex:none"></div>':'<div style="width:56px;height:56px;border-radius:10px;background:#2a2a30;flex:none;display:flex;align-items:center;justify-content:center">'+icone(tipoDesenho(p),28)+'</div>';
    h+='<div class="mp" onclick="abreSheet(\''+esc(p.id)+'\')">'+ft+'<div style="flex:1;min-width:0"><b style="font-size:14.5px">'+esc(p.nome)+'</b>'+promoTag(p)+'</div><span class="vl" style="color:var(--pri2);font-weight:800;font-size:13.5px;text-align:right">'+(pr.de?'a partir de ':'')+brl(pr.min)+'</span></div>'; });
  h+='</div>'; abreFolha(h,true);
}
function ofMascara(t){ if(!t||t.mascara===false) return ''; var f=t.mascaraForca||45; return 'linear-gradient(180deg,rgba(0,0,0,'+(f*0.0022).toFixed(3)+'),rgba(0,0,0,'+(f/100).toFixed(2)+'))'; }

/* ── som ── */
var IC_ON='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>', IC_OFF='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5Z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
var ST=null;
function atualizaSom(){ $('somc').innerHTML=(somOn?IC_ON:IC_OFF).replace(/width="19" height="19"/,'width="38" height="38"'); }
function mostraSom(){ $('somc').classList.add('on'); clearTimeout(ST); ST=setTimeout(function(){ $('somc').classList.remove('on'); },3000); }
function alternaSom(){ somOn=!somOn; vs.forEach(function(x){ x.muted=!somOn; }); var v=vs[cur]; if(v.paused) v.play().catch(function(){}); atualizaSom(); mostraSom(); }

/* ── fotos, sacola (guardada no aparelho) ── */
function fotoUrl(p,sb){ return API+'/food/foto/'+encodeURIComponent(D.cli||CLI)+'/'+encodeURIComponent(p.id)+(sb?'/'+encodeURIComponent(sb.id):'')+'?v='+(p.v||0); }
function lsk(){ return 'lf_sac_'+(D.cli||CLI); }
function sacLer(){ try{ SAC=JSON.parse(localStorage.getItem(lsk())||'[]')||[]; }catch(e){ SAC=[]; } sacMarca(); }
function sacGrava(){ try{ localStorage.setItem(lsk(),JSON.stringify(SAC)); }catch(e){} sacMarca(); }
function sacQtd(){ var n=0; SAC.forEach(function(i){ n+=i.qty; }); return n; }
function sacMarca(){ var n=sacQtd(), b=$('nSac'); b.textContent=n; b.style.display=n?'flex':'none'; }
function toast(t){ var e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){ e.style.display='none'; },2200); }
function abreFolha(h,wz,full){ var s=$('sheet'); s.className=(wz?'wz ':'')+(full===true?'fz ':'')+(full==='fx'?'fx ':'')+(s.classList.contains('on')?'on':''); s.innerHTML=h; $('ovl').style.display='block'; requestAnimationFrame(function(){ s.classList.add('on'); }); }
function fechaSheet(){ CK.on=0; CK.open=0; $('sheet').classList.remove('on'); $('ovl').style.display='none'; navOn('inicio'); }

/* ── passo a passo do produto (estilo iFood) ── */
var W=null;
/* ── desenho em contorno neon (monta junto com as escolhas) ── */
var TC1='#f97316', TC2='#f97316';
function aplicaTema(){ var c=(D.cfg&&D.cfg.cor)||''; if(!/^#[0-9a-fA-F]{6}$/.test(c)) return; TC1=c; TC2=c; var s=document.documentElement.style; s.setProperty('--pri',c); s.setProperty('--pri2',c); }
var NEON=['#fb923c','#22d3ee','#a78bfa','#f472b6','#4ade80','#facc15'];
function corGrupo(g){ var h=0,i; g=g||''; for(i=0;i<g.length;i++) h=(h*31+g.charCodeAt(i))>>>0; return NEON[h%NEON.length]; }
function icoSvg(k,c,s){
  var d='';
  if(k==='star') d='<path d="M0-9L2.6-3 9-2.6 4 1.6 5.6 8 0 4.6-5.6 8-4 1.6-9-2.6-2.6-3Z"/>';
  else if(k==='heart') d='<path d="M0 8C-12-1-8-9-3-8-1-7.5 0-6 0-5 0-6 1-7.5 3-8 8-9 12-1 0 8Z"/>';
  else if(k==='spark') d='<path d="M0-10Q1-1 10 0 1 1 0 10-1 1-10 0-1-1 0-10Z"/>';
  else d='<circle cx="-4" cy="-3" r="3.4"/><circle cx="5" cy="-1" r="3.4"/><circle cx="-1" cy="6" r="3.4"/>';
  return '<g transform="scale('+s+')" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+d+'</g>';
}
function kindGrupo(g){ g=g||''; if(/especial/i.test(g)) return 'star'; if(/doce/i.test(g)) return 'heart'; if(/novidade/i.test(g)) return 'spark'; return 'dots'; }
function kindItem(n){ n=n||''; if(/garrafa|litro|\b[12],?\d?\s?l\b|suco|[áa]gua|vinho/i.test(n)) return 'bottle'; if(/refri|coca|guaran|fanta|sprite|lata|cerveja|bebida|energ|pepsi/i.test(n)) return 'can'; return 'plus'; }
function itemSvg(k,c,s){

   +'<div style="font-size:20px;font-weight:800;margin-top:8px">Estamos fechados agora</div>'
   
   +tk+'<div class="nt" style="margin-top:10px;font-size:13px">Pedido programado entra com <b>prioridade na fila</b> assim que abrirmos.</div>'
   +'<div style="display:flex;flex-direction:column;gap:10px;margin-top:16px"><button class="bt c" style="flex:none;width:100%" onclick="abreAgenda()">Reservar meu pedido</button><button class="bt c" style="flex:none;width:100%;background:transparent;border:2px solid #ffffff44;color:#fff" onclick="fechaSheet()">Só ver o cardápio</button></div></div>';
  abreFolha(h);
}
function abreAgenda(){
  var ds=progDias(); if(!ds.length){ fechaSheet(); abreMenu(); return; }
  var at=progLer(); PGD={dia:at?at.dia:ds[0].key,hora:at?at.hora:''}; pintaAgenda();
}
function pintaAgenda(){
  var oldp=document.querySelector('.pgd'), sx=oldp?oldp.scrollLeft:0;
  var ds=progDias(), cur=null; ds.forEach(function(d){ if(d.key===PGD.dia) cur=d; }); if(!cur){ cur=ds[0]; PGD.dia=cur.key; PGD.hora=''; }
  var h='<div class="wh"><button class="bk" onclick="abreFechado()">'+BKI+'</button><b>Agendar pedido</b></div><div class="wb"><div class="nt" style="margin-bottom:8px">Escolha o dia</div><div class="pgd">';
  ds.forEach(function(d){ h+='<button class="pgc'+(d.key===PGD.dia?' on':'')+'" onclick="PGD.dia=\''+d.key+'\';PGD.hora=\'\';pintaAgenda()">'+esc(d.lab)+'</button>'; });
  h+='</div><div class="nt" style="margin:16px 0 8px">Escolha o horário <span style="opacity:.7">(dentro do nosso funcionamento)</span></div><div class="pgh">';
  cur.sl.forEach(function(x){ h+='<button class="pgc'+(x===PGD.hora?' on':'')+'" onclick="PGD.hora=\''+x+'\';pintaAgenda()">'+x+'</button>'; });
  h+='</div>'+(progTxt()?'<div class="nt" style="margin-top:16px;color:var(--pri2)">🎟 Ao agendar, '+esc(progTxt())+'.</div>':'')+'</div><div class="rod"><button class="bt c" '+(PGD.hora?'':'disabled ')+'onclick="progSim()">'+(PGD.hora?'Confirmar agendamento':'Escolha um horário')+'</button></div>';
  abreFolha(h,true);
  var np=document.querySelector('.pgd'); if(np){ np.style.scrollBehavior='auto'; np.scrollLeft=sx; var on=np.querySelector('.pgc.on'); if(on){ var l0=on.offsetLeft-np.offsetLeft, r0=l0+on.offsetWidth; if(l0<np.scrollLeft+8||r0>np.scrollLeft+np.clientWidth-30){ np.style.scrollBehavior='smooth'; np.scrollLeft=Math.max(0,l0-np.clientWidth/2+on.offsetWidth/2); } } setTimeout(function(){ np.style.scrollBehavior=''; },400); }
}
function progSim(){ if(!PGD||!PGD.hora) return; try{ localStorage.setItem('lf_prog_'+(D.cli||CLI),JSON.stringify({dia:PGD.dia,hora:PGD.hora})); }catch(e){} toast('Pedido agendado para '+progFmt(PGD)); fechaSheet(); setTimeout(abreMenu,350); }
function pintaStatus(){ var e=$('stt'); if(!e) return; var a=estaAberto(); e.textContent=a?'ABERTO':'FECHADO'; e.className=a?'ab':'fc'; }
setInterval(function(){ try{ pintaStatus(); }catch(e){} },60000);
function promoTag(p){ var d=p.promo; if(!d||!(d.valor>0)) return ''; return '<div><span class="tg">'+(d.tipo==='pct'?String(d.valor).replace('.',',')+'% OFF':'− '+brl(d.valor))+'</span></div>'; }
function menuMin(ps){ var m=0; ps.forEach(function(p){ var v=minPreco(p).min; if(v>0&&(!m||v<m)) m=v; }); return m; }
function menuFoto(g){
  var u=''; if(g.foto) u=API+'/food/foto/'+encodeURIComponent(D.cli||CLI)+'/_cat/'+encodeURIComponent(g.id)+'?v='+(g.v||0);
  else { var k; for(k=0;k<g.ps.length;k++) if(g.ps[k].foto){ u=fotoUrl(g.ps[k]); break; } }
  if(u) return '<div class="th" style="width:64px;height:64px;border-radius:12px;background:#2a2a30 center/cover url('+u+');flex:none"></div>';
  return '<div style="width:64px;height:64px;border-radius:12px;background:#2a2a30;flex:none;display:flex;align-items:center;justify-content:center;">'+icone(tipoDesenho(g.ps[0]),32)+'</div>';
}
function abreMenu(){
  var h='<div class="wh"><button class="bk" onclick="fechaSheet()">'+XI+'</button><b>Cardápio</b></div><div class="wb">';
  menuGrupos().forEach(function(g){ var mn=menuMin(g.ps);
    h+='<div class="mp" onclick="abreCat(\''+esc(g.id)+'\')">'+menuFoto(g)+'<div style="flex:1;min-width:0"><b style="font-size:15.5px">'+esc(g.nome)+'</b><div style="font-size:12.5px;color:var(--mut);margin-top:3px">'+g.ps.length+' ite'+(g.ps.length===1?'m':'ns')+(mn?' · a partir de '+brl(mn):'')+'</div>'+(g.ps.some(function(p){return p.promo&&p.promo.valor>0;})?'<div><span class="tg">Promoção</span></div>':'')+'</div><span style="color:var(--mut);font-size:22px">›</span></div>'; });
  h+='</div>'; abreFolha(h,true,'fx');
}
function abreCat(id){
  var g=null; menuGrupos().forEach(function(x){ if(x.id===id) g=x; }); if(!g){ abreMenu(); return; }
  var h='<div class="wh"><button class="bk" onclick="abreMenu()">'+BKI+'</button><b>'+esc(g.nome)+'</b></div><div class="wb">';
  g.ps.forEach(function(p){ var pr=minPreco(p), ft=p.foto?'<div class="th" style="width:56px;height:56px;border-radius:10px;background:#2a2a30 center/cover url('+fotoUrl(p)+');flex:none"></div>':'<div style="width:56px;height:56px;border-radius:10px;background:#2a2a30;flex:none;display:flex;align-items:center;justify-content:center;">'+icone(tipoDesenho(p),28)+'</div>';
    h+='<div class="mp" onclick="abreSheet(\''+esc(p.id)+'\')">'+ft+'<div style="flex:1;min-width:0"><b style="font-size:14.5px">'+esc(p.nome)+'</b>'+promoTag(p)+'</div><span class="vl" style="color:var(--pri2);font-weight:800;font-size:13.5px;text-align:right">'+(pr.de?'a partir de ':'')+(pr.orig>pr.min?'<s class="de">'+brl(pr.orig)+'</s> ':'')+brl(pr.min)+'</span></div>'; });
  h+='</div>'; abreFolha(h,true,'fx');
}

/* toque no vídeo: pula pra próxima oferta */
$('stage').addEventListener('click',function(e){ if(e.target.closest('#cards')||e.target.closest('.rb')||e.target.closest('#somc')||e.target.closest('#mnb')||e.target.closest('.ov-btn')) return; var x=e.clientX-$('stage').getBoundingClientRect().left, w=$('stage').clientWidth; if(ordem.length>1&&x>w*0.7){ cur=1-cur; tocar(idx+1); } else if(ordem.length>1&&x<w*0.3){ cur=1-cur; tocar(idx-1); } else mostraSom(); });
document.addEventListener('visibilitychange',function(){ var v=vs[cur]; if(!document.hidden&&v&&v.paused&&ordem.length) v.play().catch(function(){}); });
carregar(true); setInterval(function(){ carregar(false); },60000);
</script>
