<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cardápio · LiveFood</title>
<style>
:root{--bg:#0b0b0d;--tx:#fff;--mut:rgba(255,255,255,.68);--pri:#f97316;--pri2:#fbbf24;--glass:rgba(18,18,22,.62);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;margin:0 auto;max-width:520px;background:var(--bg);overflow:hidden}
.vd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease;background:#000}
.vd.on{opacity:1}
.shade-t{position:absolute;left:0;right:0;top:0;height:150px;background:linear-gradient(#000a,#0000);pointer-events:none}
.shade-b{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(#0000,#000d 70%);pointer-events:none}
#top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 0;z-index:5}
#segs{display:flex;gap:4px;margin-bottom:10px}
#segs i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden;position:relative}
#segs i b{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:3px}
#emp .lg{height:36px;max-width:150px;object-fit:contain;object-position:left;vertical-align:middle;filter:drop-shadow(0 1px 6px #0009)}
#bar{display:flex;align-items:center;gap:10px}
#emp{font-weight:800;font-size:15px;letter-spacing:.2px;text-shadow:0 1px 8px #0008;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#emp small{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:800;letter-spacing:1px;background:var(--pri);padding:3px 7px;border-radius:99px;vertical-align:2px}
.rb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#oft{position:absolute;left:16px;right:16px;bottom:calc(158px + env(safe-area-inset-bottom));z-index:4;font-size:22px;font-weight:900;line-height:1.15;text-shadow:0 2px 14px #000a}
#cards{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 0 calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-left:14px;padding-right:14px;scrollbar-width:none}
#cards::-webkit-scrollbar{display:none}
.cd{flex:0 0 min(78%,300px);scroll-snap-align:start;display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);cursor:pointer;animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cd .ph{width:72px;height:72px;border-radius:14px;flex:none;background:#2a2a30 center/cover no-repeat}
.cd .nm{font-weight:800;font-size:14.5px;line-height:1.2;max-height:36px;overflow:hidden}
.cd .pr{margin-top:5px;font-weight:900;font-size:15px;color:var(--pri2)}
.cd .pr small{font-size:10.5px;font-weight:700;color:var(--mut);margin-right:4px}
.cd .ds{font-size:11.5px;color:var(--mut);margin-top:2px;max-height:28px;overflow:hidden}
#som{position:absolute;z-index:6;left:50%;top:46%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:99px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);font-weight:800;font-size:14px;cursor:pointer;display:none;white-space:nowrap}
#vazio{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:8px;z-index:7;background:radial-gradient(circle at 50% 30%,#2a1608,#0b0b0d 70%)}
#vazio h2{margin:0;font-size:22px}#vazio p{margin:0;color:var(--mut);font-size:14px;max-width:300px;line-height:1.5}
#ovl{position:fixed;inset:0;background:#0008;z-index:20;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:82%;overflow:auto;z-index:21;background:#16161a;border-radius:24px 24px 0 0;padding:0 0 calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet.wz{max-height:92%;display:flex;flex-direction:column;padding:0;overflow:hidden}
.wz .wh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.wz .wh b{flex:1;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wz .pg{display:flex;gap:6px;padding:10px 16px 0}.wz .pg i{flex:1;height:4px;border-radius:4px;background:#ffffff26}.wz .pg i.on{background:var(--pri)}
.wz .wb{flex:1;overflow:auto;padding:6px 16px 16px}
.wz .gt{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px}.wz .gt h4{margin:0;font-size:15px;letter-spacing:0;text-transform:none;color:#fff}
.wz .gt small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.tg{font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:4px 8px;border-radius:6px;background:#ffffff1f;color:#fff;white-space:nowrap}.tg.ob{background:#3a3a42}
.op{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.op .nm2{flex:1;min-width:0;font-size:14.5px}.op .nm2 small{display:block;color:var(--mut);font-size:12px;margin-top:2px;line-height:1.35}
.op .vl{color:var(--pri2);font-weight:800;font-size:13.5px;white-space:nowrap}
.op .th{width:46px;height:46px;border-radius:10px;background:#2a2a30 center/cover;flex:none}
.op .ck{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff55;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#000}
.op.rd .ck{border-radius:50%}.op.cb .ck{border-radius:6px}
.op.on .ck{background:var(--pri);border-color:var(--pri)}
.op.off{opacity:.38;pointer-events:none}
.nv{display:inline-block;font-size:9.5px;font-weight:800;background:var(--pri);border-radius:5px;padding:2px 5px;margin-left:6px;vertical-align:1px}
.wz .busca{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#ffffff0f;color:#fff;font-size:14px;margin:8px 0}
.wz .rod{display:flex;gap:12px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#16161a}
.qt{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:12px}.qt button{width:36px;height:42px;background:none;border:0;color:var(--pri2);font-size:20px;font-weight:800;cursor:pointer}.qt span{min-width:22px;text-align:center;font-weight:800}
.bt{flex:1;height:48px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:800;font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:0 16px}.bt:disabled{background:#3a3a42;color:#888}
.bt.c{justify-content:center}
.wz textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:#ffffff0f;color:#fff;padding:10px;font:inherit;font-size:14px;min-height:64px}
.rs{font-size:13px;color:var(--mut);line-height:1.6;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}.rs b{color:#fff}
.bg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--pri);font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
#bSac,#bMenu{position:relative}
.sc{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:14px}.sc .i{flex:1;min-width:0}.sc small{display:block;color:var(--mut);font-size:12px;line-height:1.4;margin-top:2px}
.sc .qt button{height:34px;width:30px}
.tt{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding:14px 0}

#sheet.fz{height:100%;max-height:100%;border-radius:0}
.art{position:relative;display:flex;flex:0 0 clamp(210px,36vh,320px);background:radial-gradient(circle at 70% 50%,#2a1608 0,#16161a 66%),#16161a;overflow:hidden;border-bottom:1px solid var(--line)}
.art.big{flex:1 1 auto;min-height:300px}
.art:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(circle at 70% 50%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(circle at 70% 50%,#000 20%,transparent 75%);pointer-events:none}
.art .sv{position:relative;flex:1 1 58%;min-width:0}
.art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.art .al{position:relative;z-index:2;flex:0 0 42%;max-width:190px;padding:12px 4px 58px 14px;overflow:auto;font-size:12.5px;line-height:1.3;display:flex;flex-direction:column;gap:7px}
.art.big .al{flex:0 0 36%;max-width:170px}
.art .li{display:flex;gap:7px;align-items:flex-start;color:#fff}.art .li .e{font-size:15px;flex:none}.art .li .t{min-width:0;overflow-wrap:anywhere}
.art .li.nw{animation:lin .5s cubic-bezier(.2,1.3,.4,1) both}@keyframes lin{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.art .ai0{color:var(--mut);font-size:12px}
.art .infb{position:absolute;left:12px;bottom:10px;z-index:3;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--pri);background:#0008;color:var(--pri2);font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 0 12px var(--pri)}
.art .infp{display:none;position:absolute;left:10px;right:10px;bottom:52px;z-index:4;background:#000e;border:1px solid var(--pri);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.wz .hp{font-weight:900;font-size:19px;color:var(--pri2);white-space:nowrap;text-shadow:0 0 12px var(--pri)}
.wz .wb.fm{flex:0 0 auto;padding-top:10px}
.art .gl{filter:url(#glow)}
.art .dr{stroke-dasharray:1;stroke-dashoffset:0}.art .dr.an{animation:drw 1s ease both}
@keyframes drw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.art .pop{animation:pop .55s cubic-bezier(.2,1.6,.3,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.art .drop{animation:drop .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{from{transform:translateY(-90px);opacity:0}to{transform:none;opacity:1}}
.art .fade{animation:fd .6s ease both}@keyframes fd{from{opacity:0}to{opacity:1}}
.art .orb{animation:spin 30s linear infinite;transform-origin:180px 150px}@keyframes spin{to{transform:rotate(360deg)}}
.art .pz{animation:pz 2.6s ease-in-out infinite}@keyframes pz{50%{opacity:.55}}
.art .tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.1}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#000;font-weight:700;font-size:13px;padding:10px 16px;border-radius:99px;z-index:40;display:none;max-width:90%}
.mc{margin:16px 0 4px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.mp{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}

#sheet .fh{height:220px;background:#222 center/cover no-repeat;border-radius:24px 24px 0 0;position:relative}
#sheet .x{position:absolute;right:12px;top:12px}
#sheet .bd{padding:16px 18px 4px}
#sheet h3{margin:0 0 4px;font-size:21px}
#sheet .dd{color:var(--mut);font-size:13.5px;line-height:1.5;margin:6px 0 12px}
#sheet h4{margin:16px 0 6px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.ln{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.ln b{color:var(--pri2)}.ln span small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.nt{font-size:12px;color:var(--mut);margin-top:14px;line-height:1.5}
.ov{position:absolute;left:0;right:0;display:flex;flex-direction:column;gap:.5em;padding:0 1.2em;pointer-events:none;z-index:4;color:var(--ov-cor,#fff);font-family:inherit}
.ov.p-base{bottom:var(--ov-b,0)}.ov.p-topo{top:var(--ov-t,0)}.ov.p-centro{top:50%;transform:translateY(-50%)}
.ov.a-esq{align-items:flex-start;text-align:left}.ov.a-centro{align-items:center;text-align:center}.ov.a-dir{align-items:flex-end;text-align:right}
.ov-apoio{font-size:calc(.85em*var(--ov-apoio,1));font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.92;text-shadow:0 1px .5em #0008}
.ov-tit{font-size:calc(1.9em*var(--ov-tit,1));font-weight:900;line-height:1.08;text-shadow:0 .1em .6em #0008;overflow-wrap:anywhere}
.ov-btn{pointer-events:auto;display:inline-block;margin-top:.3em;text-decoration:none;font-weight:800;font-size:calc(1em*var(--ov-btn,1));padding:.7em 1.4em;border-radius:calc(var(--ov-raio,14)*.0625em);cursor:pointer}
.ov-btn.cheio{background:var(--ov-bf,#f97316);color:var(--ov-bt,#fff)}
.ov-btn.contorno{border:.15em solid var(--ov-bt,#fff);color:var(--ov-bt,#fff);background:transparent}
.ov-btn.link{color:var(--ov-bt,#fff);padding:.2em 0;text-decoration:underline}
#stage .ov{--ov-t:calc(84px + env(safe-area-inset-top));--ov-b:calc(172px + env(safe-area-inset-bottom));font-size:16px}
#omask{position:absolute;inset:0;pointer-events:none;z-index:3}
.ov.e-cair .ov-apoio,.ov.e-cair .ov-tit,.ov.e-cair .ov-btn{animation:ovCair .85s cubic-bezier(.2,1.3,.4,1) both}
.ov.e-lateral{--ox:-130%}.ov.e-lateral.a-dir{--ox:130%}
.ov.e-lateral .ov-apoio,.ov.e-lateral .ov-tit,.ov.e-lateral .ov-btn{animation:ovLado .7s cubic-bezier(.2,.9,.25,1) both}
.ov.e-zoom .ov-apoio,.ov.e-zoom .ov-tit,.ov.e-zoom .ov-btn{animation:ovZoom .65s cubic-bezier(.2,1.5,.4,1) both}
.ov.e-cair .ov-apoio,.ov.e-lateral .ov-apoio,.ov.e-zoom .ov-apoio{animation-delay:.05s}
.ov.e-cair .ov-tit,.ov.e-lateral .ov-tit,.ov.e-zoom .ov-tit{animation-delay:.25s}
.ov.e-cair .ov-btn,.ov.e-lateral .ov-btn,.ov.e-zoom .ov-btn{animation-delay:.5s}
.ov.pulso .ov-btn:not(.link){position:relative}
.ov.pulso .ov-btn:not(.link)::after{content:'';position:absolute;inset:0;border-radius:inherit;border:.18em solid var(--ov-bf,#f97316);animation:ovAnel 1.7s ease-out 1.4s infinite;pointer-events:none}
.ov.pulso .ov-btn.contorno::after{border-color:var(--ov-bt,#fff)}
@keyframes ovCair{0%{transform:translateY(-160%);opacity:0}55%{transform:translateY(10%);opacity:1}75%{transform:translateY(-4%)}100%{transform:none;opacity:1}}
@keyframes ovLado{from{transform:translateX(var(--ox,-130%));opacity:0}to{transform:none;opacity:1}}
@keyframes ovZoom{0%{transform:scale(.2);opacity:0}65%{transform:scale(1.1);opacity:1}100%{transform:none}}
@keyframes ovAnel{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.45,1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.ov *,.ov *::after{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <video class="vd" id="v0" muted playsinline preload="auto"></video>
  <video class="vd" id="v1" muted playsinline preload="auto"></video>
  <div id="omask"></div><div class="shade-t"></div><div class="shade-b"></div>
  <div id="top"><div id="segs"></div><div id="bar"><div id="emp"></div><button class="rb" id="bMenu" title="Cardápio" onclick="abreMenu()">📋</button><button class="rb" id="bSac" title="Sacola" onclick="abreSacola()">🛍<span class="bg" id="nSac"></span></button><button class="rb" id="bSom" title="Som" onclick="alternaSom()">🔇</button></div></div>
  <div id="ovbox"></div><div id="oft"></div>
  <button id="som" onclick="alternaSom()">🔊 Toque para ativar o som</button>
  <div id="cards"></div>
  <div id="vazio"><h2 id="vzT">Cardápio em breve</h2><p id="vzP">Ainda não há ofertas no ar. Volte daqui a pouco.</p></div>
</div>
<div id="ovl" onclick="fechaSheet()"></div>
<div id="sheet"></div><div id="toast"></div>

<script>
var API='https://giro-os-api.nucleofull.workers.dev';
var Q=new URLSearchParams(location.search), CLI=(Q.get('c')||Q.get('loja')||'').replace(/[^A-Za-z0-9_-]/g,'');
var SAC=[], LT=0, D={ofertas:[],produtos:{},empresa:''}, ordem=[], idx=-1, cur=0, vs=[document.getElementById('v0'),document.getElementById('v1')], somOn=false, tick=null, novoD=null;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function brl(n){return 'R$ '+Number(n||0).toFixed(2).replace('.',',');}
function minPreco(p){ var t=(p.tamanhos||[]).map(function(x){return x.preco;}).filter(function(x){return x>0;}); if(t.length) return {min:Math.min.apply(null,t),de:t.length>1}; return {min:p.preco||0,de:false}; }

/* ── instalar como app (manifest feito na hora, com o nome do restaurante) ── */
function manifesto(){
  try{
    var svg="data:image/svg+xml;utf8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='#f97316'/><text x='256' y='330' font-size='260' text-anchor='middle'>🍕</text></svg>");
    var m={name:D.empresa||'Cardápio',short_name:(D.empresa||'Cardápio').slice(0,12),start_url:location.href,display:'standalone',background_color:'#0b0b0d',theme_color:'#0b0b0d',icons:[{src:svg,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
    var l=document.createElement('link'); l.rel='manifest'; l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})); document.head.appendChild(l);
  }catch(e){}
}

function carregar(primeira){
  if(!CLI){ vazio('Link incompleto','Falta o código do restaurante no endereço (?c=...).'); return Promise.resolve(); }
  return fetch(API+'/food/cardapio/'+encodeURIComponent(CLI)).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){ if(primeira) vazio('Cardápio não encontrado',(d&&d.mensagem)||'Confira o link.'); return; }
    if(primeira){ D=d; sacLer(); aplicaTema(); document.title=(d.empresa||'Cardápio'); $('emp').innerHTML=((d.cfg&&d.cfg.logo)?'<img class="lg" src="'+API+'/food/foto/'+encodeURIComponent(d.cli||CLI)+'/_logo?v='+(d.cfg.v||0)+'" alt="'+esc(d.empresa)+'" onerror="this.outerHTML=\''+esc(d.empresa).replace(/'/g,'')+'\'">':esc(d.empresa))+'<small>AO VIVO</small>'; manifesto(); iniciar(); }
    else novoD=d;
  }).catch(function(){ if(primeira) vazio('Sem conexão','Não consegui abrir o cardápio. Tente de novo.'); });
}
function vazio(t,p){ $('vzT').textContent=t; $('vzP').textContent=p; $('vazio').style.display='flex'; }

function iniciar(){
  ordem=D.ofertas.slice();
  if(!ordem.length){ vazio('Cardápio em breve','Ainda não há ofertas no ar. Volte daqui a pouco.'); return; }
  $('vazio').style.display='none';
  segs(); idx=-1; cur=0; tocar(0,true);
}
function segs(){ var h='',i; for(i=0;i<ordem.length;i++) h+='<i><b id="sg'+i+'"></b></i>'; $('segs').innerHTML=h; }

function prepara(el,o){ if(el.getAttribute('data-o')===o.id&&el.getAttribute('src')) return; el.setAttribute('data-o',o.id); el.src=o.video; el.load(); }

function tocar(i,primeira){
  if(!ordem.length) return;
  idx=((i%ordem.length)+ordem.length)%ordem.length;
  var o=ordem[idx], v=vs[cur], outro=vs[1-cur];
  prepara(v,o); v.loop=(ordem.length===1); v.currentTime=0; v.muted=!somOn;
  var go=v.play(); if(go&&go.catch) go.catch(function(){ v.muted=true; somOn=false; atualizaSom(); v.play().catch(function(){}); });
  vs.forEach(function(x){ x.classList.toggle('on',x===v); });
  outro.pause();
  if(ordem.length>1){ var prox=ordem[(idx+1)%ordem.length]; prepara(outro,prox); }

  if(k==='tam'){
    h+='<div class="gt"><div><h4>Tamanho</h4><small>Escolha 1 opção</small></div><span class="tg ob">OBRIGATÓRIO</span></div>';
    p.tamanhos.forEach(function(t){ h+='<div class="op rd'+(W.tam===t.id?' on':'')+'" onclick="wTamSel(\''+esc(t.id)+'\')"><div class="nm2">'+esc(t.nome)+(t.max>1?'<small>até '+t.max+' sabores</small>':'')+'</div><span class="vl">'+brl(t.preco)+'</span><span class="ck">'+(W.tam===t.id?'✓':'')+'</span></div>'; });
  }
  if(k==='sab'){
    var mx=wMax();
    h+='<div class="gt"><div><h4>Sabores</h4><small>Escolha de 1 até '+mx+(mx>1?' · dividimos a pizza igualmente':'')+'</small></div><span class="tg ob" id="sbc">'+W.sab.length+' / '+mx+'</span></div>';
    h+='<input class="busca" id="sbq" placeholder="Buscar sabor…" value="'+esc(W.q)+'" oninput="W.q=this.value;wLista()"><div id="sbl"></div>';
  }
  if(k==='borda'){
    h+='<div class="gt"><div><h4>Borda</h4><small>Escolha 1 opção</small></div><span class="tg">OPCIONAL</span></div>';
    h+='<div class="op rd'+(W.borda==null?' on':'')+'" onclick="wBorda(null)"><div class="nm2">Sem borda recheada</div><span class="ck">'+(W.borda==null?'✓':'')+'</span></div>';
    bordas().forEach(function(a,j){ h+='<div class="op rd'+(W.borda===j?' on':'')+'" onclick="wBorda('+j+')"><div class="nm2">'+esc(a.nome)+'</div><span class="vl">+ '+brl(a.preco)+'</span><span class="ck">'+(W.borda===j?'✓':'')+'</span></div>'; });
  }
  if(k==='add'){
    h+='<div class="gt"><div><h4>Adicionais</h4><small>Escolha quantos quiser</small></div><span class="tg">OPCIONAL</span></div>';
    outros().forEach(function(a,j){ var on=W.add.indexOf(j)>=0; h+='<div class="op cb'+(on?' on':'')+'" onclick="wAdd('+j+')"><div class="nm2">'+esc(a.nome)+'</div><span class="vl">+ '+brl(a.preco)+'</span><span class="ck">'+(on?'✓':'')+'</span></div>'; });
  }
  if(k==='fim') h+=wResumo();
  h+='</div><div class="rod"><div class="qt"><button onclick="wQtd(-1)">−</button><span id="wq">'+W.qty+'</span><button onclick="wQtd(1)">+</button></div><button class="bt'+(last?'':' c')+'" id="wbt" onclick="wAvanca()"></button></div>';
  abreFolha(h,true,true); W.prev=W.prevNx; W.prevL=W.nxL; if(k==='sab') wLista(); wRod();
}
function wResumo(){
  var r='<textarea placeholder="Alguma observação? Ex.: sem cebola" oninput="W.obs=this.value">'+esc(W.obs)+'</textarea>';
  if(W.sab.some(function(id){ var s=sabPorId(id); return s&&s.balcao; })) r+='<div class="nt">⚠ Um dos sabores é só para retirada no balcão — esse pedido não poderá ser entregue.</div>';
  return r;
}
function wRod(){
  var k=W.passos[W.passo], last=W.passo===W.passos.length-1, b=$('wbt'); if(!b) return;
  b.disabled=!wPode(k); $('wq').textContent=W.qty; artPreco();
  b.innerHTML=last?'<span>Adicionar</span><span>'+brl(wUnit()*W.qty)+'</span>':'<span>Avançar</span>';
}
function wTamSel(id){ W.tam=id; var mx=wMax(); if(W.sab.length>mx) W.sab=W.sab.slice(0,mx); wPinta(); }
function wBorda(j){ W.borda=j; wPinta(); }
function wAdd(j){ var i=W.add.indexOf(j); if(i>=0) W.add.splice(i,1); else W.add.push(j); wPinta(); var wb=$('wb'); }
function wQtd(d){ W.qty=Math.max(1,Math.min(50,W.qty+d)); wRod(); }
function wVolta(){ W.passo=Math.max(0,W.passo-1); wPinta(); }
function wAvanca(){ var k=W.passos[W.passo]; if(!wPode(k)) return; if(W.passo<W.passos.length-1){ W.passo++; wPinta(); } else wAdd2(); }
function wSab(id){
  var i=W.sab.indexOf(id), mx=wMax();
  if(i>=0) W.sab.splice(i,1);
  else if(mx===1) W.sab=[id];
  else if(W.sab.length>=mx){ toast('Máximo de '+mx+' sabores neste tamanho'); return; }
  else W.sab.push(id);
  wLista(); $('sbc').textContent=W.sab.length+' / '+mx; artAtual(); wRod();
}
function wLista(){
  var q=W.q.toLowerCase().trim(), mx=wMax(), grupos={}, ordemG=[], h='';
  (W.p.sabores||[]).forEach(function(s){ if(q&&(s.nome+' '+s.desc).toLowerCase().indexOf(q)<0) return; var g=s.grupo||'Sabores'; if(!grupos[g]){ grupos[g]=[]; ordemG.push(g); } grupos[g].push(s); });
  ordemG.forEach(function(g){
    h+='<div class="mc">'+esc(g)+'</div>';
    grupos[g].forEach(function(s){
      var on=W.sab.indexOf(s.id)>=0, off=!on&&mx>1&&W.sab.length>=mx;
      h+='<div class="op '+(mx===1?'rd':'cb')+(on?' on':'')+(off?' off':'')+'" onclick="wSab(\''+esc(s.id)+'\')">'
        +(s.foto?'<div class="th" style="background-image:url('+fotoUrl(W.p,s)+')"></div>':'')
        +'<div class="nm2">'+esc(s.nome)+(s.novidade?'<span class="nv">NOVIDADE</span>':'')+(s.desc?'<small>'+esc(s.desc)+'</small>':'')+(s.balcao?'<small>🏪 Só retirada no balcão</small>':'')+'</div>'
        +(s.extra4>0?'<span class="vl">+ '+brl(s.extra4)+'<br><small style="font-weight:600;color:var(--mut)">por 1/4</small></span>':'')+'<span class="ck">'+(on?'✓':'')+'</span></div>';
    });
  });
  $('sbl').innerHTML=h||'<div class="nt">Nenhum sabor encontrado.</div>';
}
function wAdd2(){
  var t=wTam(), p=W.p, it={p:p.id,nome:p.nome,tam:t?t.nome:'',sab:W.sab.map(function(id){var s=sabPorId(id);return s?s.nome:'';}),
    borda:W.borda!=null?bordas()[W.borda].nome:'',adds:W.add.map(function(j){return outros()[j].nome;}),obs:(W.obs||'').trim().slice(0,200),
    qty:W.qty,unit:wUnit(),kind:((p.tamanhos||[]).length||(p.sabores||[]).length)?'pizza':'item',balcao:W.sab.some(function(id){var s=sabPorId(id);return s&&s.balcao;})};
  it.k=JSON.stringify([it.p,it.tam,it.sab,it.borda,it.adds,it.obs]);
  var ex=SAC.filter(function(x){return x.k===it.k;})[0]; if(ex) ex.qty=Math.min(50,ex.qty+it.qty); else SAC.push(it);
  sacGrava(); fechaSheet(); toast('Adicionado à sacola');
}

/* ── sacola ── */
function itemDesc(i){ var n=i.sab.length,l=[]; if(i.tam) l.push(esc(i.tam)); i.sab.forEach(function(s){ l.push((n>1?'1/'+n+' ':'')+esc(s)); }); if(i.borda) l.push('Borda: '+esc(i.borda)); i.adds.forEach(function(a){ l.push('+ '+esc(a)); }); if(i.obs) l.push('Obs: '+esc(i.obs)); return l.join('<br>'); }
function sacTotal(){ var t=0; SAC.forEach(function(i){ t+=i.unit*i.qty; }); return Math.round(t*100)/100; }
function abreSacola(){
  var h='<div class="wh"><button class="rb" onclick="fechaSheet()">✕</button><b>Sua sacola</b></div><div class="wb">';
  if(!SAC.length) h+='<div class="nt" style="text-align:center;padding:30px 0">Sua sacola está vazia.<br>Toque num produto para começar.</div>';
  SAC.forEach(function(i,j){ h+='<div class="sc"><div class="i"><b>'+esc(i.nome)+'</b><small>'+itemDesc(i)+'</small><div style="color:var(--pri2);font-weight:800;margin-top:4px">'+brl(i.unit*i.qty)+'</div></div><div class="qt"><button onclick="sacQ('+j+',-1)">−</button><span>'+i.qty+'</span><button onclick="sacQ('+j+',1)">+</button></div></div>'; });
  h+='</div>';
  if(SAC.length) h+='<div class="rod" style="flex-direction:column;align-items:stretch;gap:8px"><div class="tt" style="padding:0"><span>Subtotal</span><span>'+brl(sacTotal())+'</span></div><button class="bt c" onclick="toast(\'Finalizar pedido: chega no próximo passo\')">Continuar</button></div>';
  abreFolha(h,true);
}
function sacQ(j,d){ SAC[j].qty+=d; if(SAC[j].qty<=0) SAC.splice(j,1); else SAC[j].qty=Math.min(50,SAC[j].qty); sacGrava(); abreSacola(); }

/* ── cardápio completo ── */
function abreMenu(){
  var cats={}, ordc=[], h='<div class="wh"><button class="rb" onclick="fechaSheet()">✕</button><b>Cardápio</b></div><div class="wb">';
  (D.cats||[]).forEach(function(c){ cats[c.id]=[]; ordc.push(c.id); });
  var sem=[]; Object.keys(D.produtos).forEach(function(id){ var p=D.produtos[id]; if(p.cat&&cats[p.cat]) cats[p.cat].push(p); else sem.push(p); });
  function bloco(t,l){ if(!l.length) return ''; var x='<div class="mc">'+esc(t)+'</div>'; l.forEach(function(p){ var pr=minPreco(p); x+='<div class="mp" onclick="abreSheet(\''+esc(p.id)+'\')">'+(p.foto?'<div class="th" style="width:56px;height:56px;border-radius:10px;background:#2a2a30 center/cover url('+fotoUrl(p)+');flex:none"></div>':'')+'<div style="flex:1;min-width:0"><b style="font-size:14.5px">'+esc(p.nome)+'</b>'+(p.desc?'<div class="ds" style="font-size:12px;color:var(--mut);max-height:32px;overflow:hidden">'+esc(p.desc)+'</div>':'')+'</div><span class="vl" style="color:var(--pri2);font-weight:800;font-size:13.5px;white-space:nowrap">'+(pr.de?'a partir de ':'')+brl(pr.min)+'</span></div>'; }); return x; }
  (D.cats||[]).forEach(function(c){ h+=bloco(c.nome,cats[c.id]); }); h+=bloco(ordc.length?'Outros':'Produtos',sem);
  h+='</div>'; abreFolha(h,true);
}

/* toque no vídeo: pula pra próxima oferta */
$('stage').addEventListener('click',function(e){ if(e.target.closest('#cards')||e.target.closest('.rb')||e.target.closest('#som')||e.target.closest('.ov-btn')) return; if(ordem.length>1){ cur=1-cur; tocar(idx+1); } });
document.addEventListener('visibilitychange',function(){ var v=vs[cur]; if(!document.hidden&&v&&v.paused&&ordem.length) v.play().catch(function(){}); });
carregar(true); setInterval(function(){ carregar(false); },60000);
</script>
