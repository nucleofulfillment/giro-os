<script>
var API='https://giro-os-api.nucleofull.workers.dev';
/* (092) a loja vem do link: livefood.tec.br/<loja>/mesa/7 (LF_ROTA, montado pelo 404.html) ou o formato antigo livefood.html?c=<código>&mesa=7 */
var Q=new URLSearchParams(location.search), ROTA=window.LF_ROTA||{}, CLI=(ROTA.c||Q.get('c')||Q.get('loja')||'').replace(/[^A-Za-z0-9_-]/g,''), MESA=(ROTA.mesa||Q.get('mesa')||'').replace(/\D/g,'').slice(0,3);
/* (109) versão do WhatsApp: livefood.tec.br/<loja>/cardapio — o cliente monta a sacola e envia o pedido pelo WhatsApp da loja */
var WA=!MESA&&!!(ROTA.wa||Q.get('wa')==='1');
function lfLink(mesa){ var s=(D&&D.slug)||CLI; return location.origin+'/'+encodeURIComponent(s)+(mesa?'/mesa/'+mesa:(WA?'/cardapio':'')); }
function waOn(){ return WA&&!!(D&&D.cfg&&D.cfg.wa); }
var SAC=[], LT=0, D={ofertas:[],produtos:{},empresa:''}, ordem=[], idx=-1, cur=0, vs=[document.getElementById('v0'),document.getElementById('v1')], somOn=false, tick=null, novoD=null;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function brl(n){return 'R$ '+Number(n||0).toFixed(2).replace('.',',');}
function desc(p,v){ var d=p.promo; if(!d||!(v>0)) return v; var r=d.tipo==='pct'?v*(1-d.valor/100):v-d.valor; return Math.max(0,Math.round(r*100)/100); }
function precoHtml(p,v){ var n=desc(p,v); return n<v?'<s class="de">'+brl(v)+'</s> '+brl(n):brl(v); }
function minPreco(p){ var r=minPreco0(p); var n=desc(p,r.min); return {min:n,orig:r.min,de:r.de}; }
function minPreco0(p){ var t=(p.tamanhos||[]).map(function(x){return x.preco;}).filter(function(x){return x>0;}); if(t.length) return {min:Math.min.apply(null,t),de:t.length>1}; return {min:p.preco||0,de:false}; }

/* ── instalar como app (manifest feito na hora, com o nome do restaurante) ── */
function manifesto(){
  try{
    var base=document.baseURI.replace(/[?#].*$/,'').replace(/[^\/]*$/,''), ini=CLI?lfLink(''):location.origin+location.pathname;
    var m={name:'LiveFood',short_name:'LiveFood',description:'Cardápio e pedidos',id:ini,start_url:ini,scope:base,display:'standalone',orientation:'portrait',background_color:'#0b0705',theme_color:'#0b0705',icons:[{src:base+'livefood-icon-192.png',sizes:'192x192',type:'image/png',purpose:'any'},{src:base+'livefood-icon-512.png',sizes:'512x512',type:'image/png',purpose:'any'},{src:base+'livefood-icon-maskable-512.png',sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    var l=document.createElement('link'); l.rel='manifest'; l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})); document.head.appendChild(l);
    var a=document.createElement('link'); a.rel='apple-touch-icon'; a.href=base+'livefood-icon-180.png'; document.head.appendChild(a);
    if('serviceWorker' in navigator) navigator.serviceWorker.register(base+'livefood-sw.js').catch(function(){});
  }catch(e){}
}

function carregar(primeira){
  if(!CLI){ vazio('Bem-vindo ao LiveFood','Escaneie o QR Code da sua mesa ou abra o link do restaurante para ver o cardápio.'); try{ var vz=$('vazio'); if(vz&&!$('vz-lg')){ var g=document.createElement('img'); g.id='vz-lg'; g.src='livefood-logo.png'; g.alt='LiveFood'; g.style.cssText='height:46px;margin-bottom:18px'; vz.insertBefore(g,vz.firstChild); } }catch(e){} return Promise.resolve(); }
  return fetch(API+'/food/cardapio/'+encodeURIComponent(CLI)).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){ if(primeira) vazio('Cardápio não encontrado',(d&&d.mensagem)||'Confira o link.'); return; }
    if(primeira){ D=d; CLI=d.cli||CLI; sacLer(); aplicaTema(); navOn('inicio'); temaAplica(); wizPill(); mesaInit(); document.title=(d.empresa||'Cardápio'); $('emp').innerHTML=((d.cfg&&d.cfg.logo)?'<img class="lg" src="'+API+'/food/foto/'+encodeURIComponent(d.cli||CLI)+'/_logo?v='+(d.cfg.v||0)+'" alt="'+esc(d.empresa)+'" onerror="this.outerHTML=\''+esc(d.empresa).replace(/'/g,'')+'\'">':esc(d.empresa))+'<small id="stt"></small>'; pintaStatus(); try{ if(!estaAberto()&&!sessionStorage.getItem('lf_fcm_'+(d.cli||CLI))){ sessionStorage.setItem('lf_fcm_'+(d.cli||CLI),'1'); setTimeout(abreFechado,600); } }catch(e){} manifesto(); iniciar(); clbInit(); }
    else novoD=d;
  }).catch(function(){ if(primeira) vazio('Sem conexão','Não consegui abrir o cardápio. Tente de novo.'); });
}
function vazio(t,p){ $('vzB').style.display='none'; $('vzT').textContent=t; $('vzP').textContent=p; $('vazio').style.display='flex'; }

/* sem ofertas no ar: mostra os produtos cadastrados (botão + abre a lista) e o aviso */
function semOfertas(abre){
  var tem=Object.keys(D.produtos||{}).length;
  if(!tem){ vazio('Cardápio em breve','Ainda não há ofertas no ar. Volte daqui a pouco.'); return; }
  vazio('Cadastre suas ofertas','Cadastre suas ofertas no painel para exibir aqui. Enquanto isso, o cardápio já está disponível.'); $('vzB').style.display='block';
  if(abre) setTimeout(function(){ try{ abreMenu(); }catch(e){} },300);
}
function iniciar(){
  ordem=D.ofertas.slice();
  if(!ordem.length){ semOfertas(true); return; }
  $('vazio').style.display='none'; mostraSom();
  segs(); idx=-1; cur=0; tocar(0,true);
}
function segs(){ var h='',i; for(i=0;i<ordem.length;i++) h+='<i><b id="sg'+i+'"></b></i>'; $('segs').innerHTML=h; }

function prepara(el,o){ if(el.getAttribute('data-o')===o.id&&el.getAttribute('src')) return; el.setAttribute('data-o',o.id); el.src=o.video; el.load(); }

function tocar(i,primeira){
  if(!ordem.length) return;
  idx=((i%ordem.length)+ordem.length)%ordem.length;
  var o=ordem[idx], v=vs[cur], outro=vs[1-cur];
  prepara(v,o); v.loop=(ordem.length===1); v.currentTime=0; v.muted=!somOn;
  var go=v.play(); if(go&&go.catch) go.catch(function(){ v.muted=true; somOn=false; atualizaSom(); v.play().catch(function(){}); });
  vs.forEach(function(x){ x.classList.toggle('on',x===v); });
  outro.pause();
  if(ordem.length>1){ var prox=ordem[(idx+1)%ordem.length]; prepara(outro,prox); }
  var ovh=ofOverlay(o.txt,o.id); $('ovbox').innerHTML=ovh||''; $('omask').style.background=ovh?ofMascara(o.txt):'';
  $('oft').textContent=ovh?'':(o.nome||'');
  cartoes(o);
  for(var k=0;k<ordem.length;k++){ var b=$('sg'+k); if(b) b.style.width=(k<idx?'100%':'0'); }
  v.onended=function(){ proximo(); };
  v.onerror=function(){ setTimeout(proximo,600); };
  atualizaSom();
}
function proximo(){
  if(novoD&&(idx+1)%ordem.length===0){ D=novoD; novoD=null; ordem=D.ofertas.slice(); segs(); if(!ordem.length){ vs.forEach(function(x){x.pause();}); semOfertas(false); return; } cur=1-cur; tocar(0); return; }
  cur=1-cur; tocar(idx+1);
}
setInterval(function(){
  var v=vs[cur], b=$('sg'+idx); if(v&&ordem.length===1&&v.currentTime<LT-0.5){ var oo=ordem[0], hh=ofOverlay(oo.txt,oo.id); if(hh) $('ovbox').innerHTML=hh; } LT=v?v.currentTime:0; if(b&&v&&v.duration>0) b.style.width=Math.min(100,(v.currentTime/v.duration)*100)+'%';
},200);

function cartoes(o){

  if(v==null){ var ok=c.escopo==='loja'||(c.escopo==='cats'&&(c.cats||[]).indexOf(p.cat)>=0)||(c.escopo==='prods'&&(c.prods||[]).indexOf(p.id)>=0), dg=clbDescGeral(); if(ok&&dg) v=dg.tipo==='pct'?base*(1-dg.valor/100):base-dg.valor; }
  if(v==null||!(base>0)) return null; v=Math.max(0,Math.round(v*100)/100); if(Math.abs(v-base)<0.005) return null;

/* desconto mostrado para quem ainda não assina: o geral; sem geral, o maior entre os planos */
function clbDescGeral(){ var c=D.clube; if(c.valor>0) return {tipo:c.tipo,valor:c.valor}; var m=null; ['tri','sem','anu'].forEach(function(k){ var p=c.planos[k], d=p&&p.on&&p.desc; if(d&&d.valor>0&&(!m||(d.tipo===m.tipo?d.valor>m.valor:d.tipo==='pct'))) m=d; }); return m; }

function clbSelo(p){ if(clbMembro()) return ''; var r=clbPreco(p); if(!r||!(r.pct>0)) return ''; return '<div class="clb-selo">'+clbGema()+'<b>-'+r.pct+'%</b></div>'; }

function clbInit(){ var b=$('clbBtn'), sd=$('mside'); if(!D.clube||!D.clube.ativo||clbMembro()||!sd){ if(b) b.remove(); return; } if(b) return; b=document.createElement('button'); b.id='clbBtn'; b.type='button'; b.className='clb-sh'; b.setAttribute('aria-label','Assinar o clube'); b.innerHTML=clbGema()+'ASSINAR CLUBE'; b.onclick=function(e){ e.stopPropagation(); clbAbre(); }; sd.insertBefore(b,sd.firstChild); }
function clbAbre(){

      +(ch.length?'<div class="chips">'+ch.map(function(x){ return '<span>'+x+'</span>'; }).join('')+'</div>':'')

  });

  var m=document.createElement('div'); m.id='clbM'; m.innerHTML=h; m.addEventListener('click',function(e){ if(e.target===m) clbFecha(); }); document.body.appendChild(m);

/* nessa versão o pedido termina no WhatsApp: sem as abas de pedidos e conta do site */

/* o botão guarda a sacola no sistema (com um código) e abre o WhatsApp da loja com a lista escrita; o Live recebe o código e já monta o carrinho certinho */
function waEnviar(){
  if(!SAC.length||!waOn()) return; var b=$('wa-env'); if(b){ if(b.disabled) return; b.disabled=true; b.lastChild.textContent='Preparando seu pedido…'; }
  var volta=function(m){ if(b){ b.disabled=false; b.lastChild.textContent='Enviar lista para o WhatsApp'; } if(m) toast(m); };
  fetch(API+'/food/rascunho',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cli:D.cli||CLI,itens:SAC.map(function(i){ return {p:i.p,tam:i.tam,sab:i.sab,borda:i.borda,adds:i.adds,obs:i.obs,qty:i.qty}; })})})
    .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })

    }).catch(function(){ volta('Sem conexão. Tente de novo.'); });
}
/* abertura da versão do WhatsApp: a sacola com o Live, os 3 passos e os ícones caindo; aparece só no primeiro acesso a cada loja */

  document.body.appendChild(w);
