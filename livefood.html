<script>

var SAC=[], LT=0, D={ofertas:[],produtos:{},empresa:''}, ordem=[], idx=-1, cur=0, vs=[document.getElementById('v0'),document.getElementById('v1')], somOn=false, tick=null, novoD=null;

function brl(n){return 'R$ '+Number(n||0).toFixed(2).replace('.',',');}
function desc(p,v){ var d=p.promo; if(!d||!(v>0)) return v; var r=d.tipo==='pct'?v*(1-d.valor/100):v-d.valor; return Math.max(0,Math.round(r*100)/100); }

  if(!ordem.length) return;
  idx=((i%ordem.length)+ordem.length)%ordem.length;
  var o=ordem[idx], v=vs[cur], outro=vs[1-cur];

  vs.forEach(function(x){ x.classList.toggle('on',x===v); });

  var ovh=ofOverlay(o.txt); $('ovbox').innerHTML=ovh||''; $('omask').style.background=ovh?ofMascara(o.txt):'';

  var k=W.passos[W.passo], last=W.passo===W.passos.length-1, b=$('wbt'); if(!b) return;
  b.disabled=!wPode(k); $('wq').textContent=W.qty; artPreco();
  b.innerHTML=last?'<span>'+(W.edK!=null?'Salvar alterações':'Adicionar')+'</span><span>'+brl(wUnit()*W.qty)+'</span>':'<span>Avançar</span>';
}
function wTamSel(id){ W.tam=id; var mx=wMax(); if(W.sab.length>mx) W.sab=W.sab.slice(0,mx); wPinta(); }
function wBorda(j){ W.borda=j; wPinta(); }
function wAdd(j){ var i=W.add.indexOf(j); if(i>=0) W.add.splice(i,1); else W.add.push(j); wPinta(); var wb=$('wb'); }
function wQtd(d){ W.qty=Math.max(1,Math.min(50,W.qty+d)); wRod(); }
function wVolta(){ W.passo=Math.max(0,W.passo-1); wPinta(); }
function wAvanca(){ var k=W.passos[W.passo]; if(!wPode(k)) return; if(W.passo<W.passos.length-1){ W.passo++; wPinta(); } else wAdd2(); }
function wSab(id){
  var i=W.sab.indexOf(id), mx=wMax();
  if(i>=0) W.sab.splice(i,1);
  else if(mx===1) W.sab=[id];
  else if(W.sab.length>=mx){ toast('Máximo de '+mx+' sabores neste tamanho'); return; }
  else W.sab.push(id);
  wLista(); $('sbc').textContent=W.sab.length+' / '+mx; artAtual(); wRod();
}
function wLista(){
  var q=W.q.toLowerCase().trim(), mx=wMax(), grupos={}, ordemG=[], h='';
  (W.p.sabores||[]).forEach(function(s){ if(q&&(s.nome+' '+s.desc).toLowerCase().indexOf(q)<0) return; var g=s.grupo||'Sabores'; if(!grupos[g]){ grupos[g]=[]; ordemG.push(g); } grupos[g].push(s); });
  ordemG.forEach(function(g){
    h+='<div class="mc">'+esc(g)+'</div>';
    grupos[g].forEach(function(s){
      var on=W.sab.indexOf(s.id)>=0, off=!on&&mx>1&&W.sab.length>=mx;
      h+='<div class="op '+(mx===1?'rd':'cb')+(on?' on':'')+(off?' off':'')+'" onclick="wSab(\''+esc(s.id)+'\')">'
        +(s.foto?'<div class="th" style="background-image:url('+fotoUrl(W.p,s)+')"></div>':'')
        +'<div class="nm2">'+esc(s.nome)+(s.novidade?'<span class="nv">NOVIDADE</span>':'')+(s.desc?'<small>'+esc(s.desc)+'</small>':'')+(s.balcao?'<small>🏪 Só retirada no balcão</small>':'')+'</div>'
        +(s.extra4>0?'<span class="vl">+ '+brl(s.extra4)+'<br><small style="font-weight:600;color:var(--mut)">por 1/4</small></span>':'')+'<span class="ck">'+(on?'✓':'')+'</span></div>';
    });
  });
  $('sbl').innerHTML=h||'<div class="nt">Nenhum sabor encontrado.</div>';
}
function wAdd2(){
  var t=wTam(), p=W.p, it={p:p.id,nome:p.nome,tam:t?t.nome:'',sab:W.sab.map(function(id){var s=sabPorId(id);return s?s.nome:'';}),
    borda:W.borda!=null?bordas()[W.borda].nome:'',adds:W.add.map(function(j){return outros()[j].nome;}),obs:(W.obs||'').trim().slice(0,200),
    qty:W.qty,unit:wUnit(),kind:((p.tamanhos||[]).length||(p.sabores||[]).length)?'pizza':'item',tipo:tipoDesenho(p),balcao:W.sab.some(function(id){var s=sabPorId(id);return s&&s.balcao;})};
  it.k=JSON.stringify([it.p,it.tam,it.sab,it.borda,it.adds,it.obs]);
  if(W.edK!=null&&SAC[W.edK]){
    var oj=W.edK; SAC[oj]=it; var dup=-1; SAC.forEach(function(x,j){ if(j!==oj&&x.k===it.k) dup=j; });
    if(dup>=0){ SAC[dup].qty=Math.min(50,SAC[dup].qty+it.qty); SAC.splice(oj,1); }
    sacGrava(); abreSacola(); toast('Item atualizado'); return;
  }
  var ex=SAC.filter(function(x){return x.k===it.k;})[0]; if(ex) ex.qty=Math.min(50,ex.qty+it.qty); else SAC.push(it);
  sacGrava(); sacPos();
}
function sacPos(){
  var h='<div class="wb" style="text-align:center;padding:28px 20px 24px"><svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="var(--pri)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg><div style="font-size:18px;font-weight:800;margin-top:10px">Adicionado à sacola!</div><div class="nt" style="margin-top:4px">O que você quer fazer agora?</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:20px"><button class="bt c" style="flex:none;width:100%" onclick="abreSacola()">Finalizar pedido · '+brl(sacTotal())+'</button><button class="bt c" style="flex:none;width:100%;background:transparent;border:2px solid var(--pri);color:var(--pri)" onclick="abreMenu()">+ Adicionar mais itens</button></div></div>';
  abreFolha(h);
}
function sacEdit(j){
  var it=SAC[j]; if(!it) return; var p=D.produtos[it.p]; if(!p){ toast('Este produto não está mais disponível'); return; }
  W={p:p,tam:null,sab:[],borda:null,add:[],qty:it.qty,obs:it.obs||'',passo:0,q:'',edK:j};
  var tm=(p.tamanhos||[]).filter(function(t){return t.nome===it.tam;})[0]; if(tm) W.tam=tm.id; else if((p.tamanhos||[]).length===1) W.tam=p.tamanhos[0].id;
  it.sab.forEach(function(n){ var s=(p.sabores||[]).filter(function(x){return x.nome===n;})[0]; if(s) W.sab.push(s.id); });
  var bi=bordas().map(function(a){return a.nome;}).indexOf(it.borda); W.borda=(it.borda&&bi>=0)?bi:null;
  var os=outros().map(function(a){return a.nome;}); it.adds.forEach(function(n){ var k=os.indexOf(n); if(k>=0) W.add.push(k); });
  W.passos=wPassos(); W.passo=W.passos.length-1; wPinta(true);
}

/* ── sacola ── */
function itemDesc(i){ var n=i.sab.length,l=[]; if(i.tam) l.push(esc(i.tam)); i.sab.forEach(function(s){ l.push((n>1?'1/'+n+' ':'')+esc(s)); }); if(i.borda) l.push('Borda: '+esc(i.borda)); i.adds.forEach(function(a){ l.push('+ '+esc(a)); }); if(i.obs) l.push('Obs: '+esc(i.obs)); return l.join('<br>'); }
function sacTotal(){ var t=0; SAC.forEach(function(i){ t+=i.unit*i.qty; }); return Math.round(t*100)/100; }
var XI='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>', XP='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>';
function abreSacola(){
  var h='<div class="wh"><button class="bk" onclick="fechaSheet()">'+XI+'</button><b>Sua sacola</b>'+(SAC.length?'<button class="lmp" id="lmp" onclick="sacLimpa()">Limpar sacola</button>':'')+'</div><div class="wb">';
  if(!SAC.length) h+='<div class="nt" style="text-align:center;padding:30px 0">Sua sacola está vazia.<br>Toque num produto para começar.</div>';
  SAC.forEach(function(i,j){ h+='<div class="sc"><div class="i"><b>'+esc(i.nome)+'</b><small>'+itemDesc(i)+'</small><div style="color:var(--pri);font-weight:800;margin-top:4px">'+brl(i.unit*i.qty)+'</div><button class="sed" onclick="sacEdit('+j+')">Editar</button></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px"><button class="sx" onclick="sacQ('+j+',-999)" title="Remover">'+XP+'</button><div class="qt"><button onclick="sacQ('+j+',-1)">−</button><span>'+i.qty+'</span><button onclick="sacQ('+j+',1)">+</button></div></div></div>'; });
  h+='</div>';
  if(SAC.length) h+='<div class="rod" style="flex-direction:column;align-items:stretch;gap:8px"><div class="tt" style="padding:0"><span>Subtotal</span><span>'+brl(sacTotal())+'</span></div><button class="bt c" style="flex:none;width:100%" onclick="toast(\'Finalizar pedido: chega no próximo passo\')">Continuar</button></div>';
  abreFolha(h,true);
}
var LMP=null;
function sacLimpa(){ var b=$('lmp'); if(!b) return; if(!LMP){ b.textContent='Confirmar?'; b.classList.add('cf'); LMP=setTimeout(function(){ LMP=null; var c=$('lmp'); if(c){ c.textContent='Limpar sacola'; c.classList.remove('cf'); } },3000); return; } clearTimeout(LMP); LMP=null; SAC=[]; sacGrava(); abreSacola(); }
function sacQ(j,d){ SAC[j].qty+=d; if(SAC[j].qty<=0) SAC.splice(j,1); else SAC[j].qty=Math.min(50,SAC[j].qty); sacGrava(); abreSacola(); }

/* ── cardápio: categorias (pai) → itens (filhos) ── */
var ICO={
pizza:'<path d="M3 6c6-3 12-3 18 0L12 21z"/><circle cx="10" cy="9" r="1.2"/><circle cx="14" cy="11" r="1.2"/><circle cx="11.5" cy="14" r="1.2"/>',
hamburguer:'<path d="M4 10a8 6 0 0116 0z"/><path d="M3 14h18"/><path d="M4 17.5h16"/><path d="M5 17.5a3 3 0 003 2.5h8a3 3 0 003-2.5"/>',
bebida:'<path d="M6 5h12l-1.5 15h-9z"/><path d="M6.5 9h11"/><path d="M13 5l2-3"/>',
porcao:'<path d="M5 10h14l-1.5 10h-11z"/><path d="M7.5 10V5M10.5 10V3.5M13.5 10V5M16.5 10V4"/>',
sobremesa:'<path d="M4 20h16M6 20l-1-8h14l-1 8"/><path d="M5 12a4 4 0 014-4 4 4 0 016 0 4 4 0 014 4"/><circle cx="12" cy="5" r="1.2"/>',
acai:'<path d="M5 11h14l-2 9H7z"/><path d="M5 11c0-3 3-5 7-5s7 2 7 5"/><path d="M15 3l-2 5"/>',
outro:'<circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="3"/><path d="M3 4v6a2 2 0 002 2M5 4v16M21 4c-2 1-3 4-3 8h3v8"/>'
};
function icone(t,s){ s=s||30; return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="var(--pri2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(ICO[t]||ICO.outro)+'</svg>'; }
var BKI='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>';
function menuGrupos(){
  var cats={}, g=[]; (D.cats||[]).forEach(function(c){ cats[c.id]={id:c.id,nome:c.nome,foto:c.foto,v:c.v,ps:[]}; g.push(cats[c.id]); });
  var sem={id:'_',nome:g.length?'Outros':'Produtos',ps:[]}; Object.keys(D.produtos).forEach(function(id){ var p=D.produtos[id]; if(p.cat&&cats[p.cat]) cats[p.cat].ps.push(p); else sem.ps.push(p); });
  g.push(sem); return g.filter(function(x){ return x.ps.length; });
}
function menuMin(ps){ var m=0; ps.forEach(function(p){ var v=minPreco(p).min; if(v>0&&(!m||v<m)) m=v; }); return m; }
function menuFoto(g){
  var u=''; if(g.foto) u=API+'/food/foto/'+encodeURIComponent(D.cli||CLI)+'/_cat/'+encodeURIComponent(g.id)+'?v='+(g.v||0);
  else { var k; for(k=0;k<g.ps.length;k++) if(g.ps[k].foto){ u=fotoUrl(g.ps[k]); break; } }
  if(u) return '<div class="th" style="width:64px;height:64px;border-radius:12px;background:#2a2a30 center/cover url('+u+');flex:none"></div>';
  return '<div style="width:64px;height:64px;border-radius:12px;background:#2a2a30;flex:none;display:flex;align-items:center;justify-content:center;">'+icone(tipoDesenho(g.ps[0]),32)+'</div>';
}
function abreMenu(){
  var h='<div class="wh"><button class="bk" onclick="fechaSheet()">'+XI+'</button><b>Cardápio</b></div><div class="wb">';
  menuGrupos().forEach(function(g){ var mn=menuMin(g.ps);
    h+='<div class="mp" onclick="abreCat(\''+esc(g.id)+'\')">'+menuFoto(g)+'<div style="flex:1;min-width:0"><b style="font-size:15.5px">'+esc(g.nome)+'</b><div style="font-size:12.5px;color:var(--mut);margin-top:3px">'+g.ps.length+' ite'+(g.ps.length===1?'m':'ns')+(mn?' · a partir de '+brl(mn):'')+'</div></div><span style="color:var(--mut);font-size:22px">›</span></div>'; });
  h+='</div>'; abreFolha(h,true);
}
function abreCat(id){
  var g=null; menuGrupos().forEach(function(x){ if(x.id===id) g=x; }); if(!g){ abreMenu(); return; }
  var h='<div class="wh"><button class="bk" onclick="abreMenu()">'+BKI+'</button><b>'+esc(g.nome)+'</b></div><div class="wb">';
  g.ps.forEach(function(p){ var pr=minPreco(p), ft=p.foto?'<div class="th" style="width:56px;height:56px;border-radius:10px;background:#2a2a30 center/cover url('+fotoUrl(p)+');flex:none"></div>':'<div style="width:56px;height:56px;border-radius:10px;background:#2a2a30;flex:none;display:flex;align-items:center;justify-content:center;">'+icone(tipoDesenho(p),28)+'</div>';
    h+='<div class="mp" onclick="abreSheet(\''+esc(p.id)+'\')">'+ft+'<div style="flex:1;min-width:0"><b style="font-size:14.5px">'+esc(p.nome)+'</b></div><span class="vl" style="color:var(--pri2);font-weight:800;font-size:13.5px;text-align:right">'+(pr.de?'a partir de ':'')+(pr.orig>pr.min?'<s class="de">'+brl(pr.orig)+'</s> ':'')+brl(pr.min)+'</span></div>'; });
  h+='</div>'; abreFolha(h,true);
}

/* toque no vídeo: pula pra próxima oferta */
$('stage').addEventListener('click',function(e){ if(e.target.closest('#cards')||e.target.closest('.rb')||e.target.closest('#somc')||e.target.closest('#mnb')||e.target.closest('.ov-btn')) return; var x=e.clientX-$('stage').getBoundingClientRect().left, w=$('stage').clientWidth; if(ordem.length>1&&x>w*0.7){ cur=1-cur; tocar(idx+1); } else if(ordem.length>1&&x<w*0.3){ cur=1-cur; tocar(idx-1); } else mostraSom(); });
document.addEventListener('visibilitychange',function(){ var v=vs[cur]; if(!document.hidden&&v&&v.paused&&ordem.length) v.play().catch(function(){}); });
carregar(true); setInterval(function(){ carregar(false); },60000);
