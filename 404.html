<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/site/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/site/img/icone-32.png">
<link rel="apple-touch-icon" href="/site/img/icone-180.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>LiveFood</title>
<!-- (092) Endereço curto do cardápio. O GitHub Pages mostra esta página para qualquer endereço que não é arquivo:
     livefood.tec.br/trilhos          → cardápio da loja "trilhos"
     livefood.tec.br/trilhos/mesa/7   → cardápio da mesa 7
     Ela carrega o livefood.html por dentro e mantém o endereço curto na barra do navegador. -->
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,system-ui,sans-serif;color:#29231E}
  .nf{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .nf img{height:40px;width:auto}
  .nf a{color:#FF5A00;font-weight:800;text-decoration:none}
</style>
<script>
(function () {
  var p = location.pathname.replace(/^\/+|\/+$/g, '').split('/');
  /* (184) LiveFest da casa: livefood.tec.br/livefest/<casa> e livefood.tec.br/livefest/<casa>/<evento>
     (no domínio livefest.com.br, quando existir: livefest.com.br/<casa>) */
  var fp = location.hostname.indexOf('livefest') >= 0 ? p : (p[0] === 'livefest' ? p.slice(1) : null);
  if (fp && fp.length >= 1 && fp.length <= 2 && /^[A-Za-z0-9_-]{2,40}$/.test(fp[0]) && (!fp[1] || /^[A-Za-z0-9-]{2,60}$/.test(fp[1]))) {
    var fr = { casa: fp[0].toLowerCase(), ev: fp[1] || '' };
    fetch('/livefest.html', { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (h) {
      h = h.replace(/<head>/i, '<head><base href="/"><script>window.LF_FEST=' + JSON.stringify(fr) + '<\/script>');
      document.open(); document.write(h); document.close();
    }).catch(function () { location.replace('/livefest.html?casa=' + encodeURIComponent(fr.casa) + (fr.ev ? '&ev=' + fr.ev : '')); });
    return;
  }
  /* (193) livefood.tec.br/p/<loja> = link da mensagem do Marketing: anota que o dono abriu e vai para o cardápio da mesa 1 */
  if (p[0] === 'p' && p.length === 2 && /^[A-Za-z0-9_-]{2,40}$/.test(p[1])) {
    var lp = p[1].toLowerCase(), vai = function () { location.replace('/' + lp + '/mesa/1'); };
    var to = setTimeout(vai, 2500);
    fetch('https://giro-os-api.nucleofull.workers.dev/mkt/abriu/' + lp, { cache: 'no-store' }).then(function () { clearTimeout(to); vai(); }, function () { clearTimeout(to); vai(); });
    return;
  }
  var loja = /^[A-Za-z0-9_-]{2,40}$/.test(p[0] || '') ? p[0] : '';
  /* (109) livefood.tec.br/<loja>/cardapio → versão do WhatsApp: monta a sacola e envia o pedido pelo WhatsApp da loja */
  var wa = p.length === 2 && p[1].toLowerCase() === 'cardapio';
  /* (159) livefood.tec.br/<loja>/r/<código> → pagar a parte de uma conta rachada */
  var parte = p.length === 3 && p[1].toLowerCase() === 'r' && /^[a-f0-9]{8,32}$/.test(p[2]) ? p[2] : '';
  var ok = loja && (p.length === 1 || wa || parte || (p.length === 3 && p[1].toLowerCase() === 'mesa' && /^\d{1,3}$/.test(p[2])));
  if (!ok) {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML = '<div class="nf"><img src="/livefood-logo.png" alt="LiveFood"><h1>Página não encontrada</h1><p>Confira o endereço ou volte para o início.</p><a href="/">Ir para a LiveFood</a></div>';
    });
    return;
  }
  var rota = { c: loja.toLowerCase(), mesa: (wa || parte) ? '' : (p[2] || ''), wa: wa ? 1 : 0, r: parte };
  fetch('/livefood.html', { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (h) {
    h = h.replace(/<head>/i, '<head><base href="/"><script>window.LF_ROTA=' + JSON.stringify(rota) + '<\/script>');
    document.open(); document.write(h); document.close();
  }).catch(function () { location.replace('/livefood.html?c=' + encodeURIComponent(rota.c) + (rota.mesa ? '&mesa=' + rota.mesa : '') + (rota.wa ? '&wa=1' : '') + (rota.r ? '&r=' + rota.r : '') + (/[?&]clube=ver\b/.test(location.search) ? '&clube=ver' : '')); });
})();
</script>
</head>
<body></body>
</html>
