<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>LiveFood</title>
<!-- (092) Endereço curto do cardápio. O GitHub Pages mostra esta página para qualquer endereço que não é arquivo:
     livefood.tec.br/trilhos          → cardápio da loja "trilhos"
     livefood.tec.br/trilhos/mesa/7   → cardápio da mesa 7
     Ela carrega o livefood.html por dentro e mantém o endereço curto na barra do navegador. -->
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,system-ui,sans-serif;color:#29231E}
  .nf{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .nf img{height:40px;width:auto}
  .nf a{color:#FF5A00;font-weight:800;text-decoration:none}
</style>
<script>
(function () {
  var p = location.pathname.replace(/^\/+|\/+$/g, '').split('/');
  var loja = /^[A-Za-z0-9_-]{2,40}$/.test(p[0] || '') ? p[0] : '';
  var ok = loja && (p.length === 1 || (p.length === 3 && p[1].toLowerCase() === 'mesa' && /^\d{1,3}$/.test(p[2])));
  if (!ok) {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML = '<div class="nf"><img src="/livefood-logo.png" alt="LiveFood"><h1>Página não encontrada</h1><p>Confira o endereço ou volte para o início.</p><a href="/">Ir para a LiveFood</a></div>';
    });
    return;
  }
  var rota = { c: loja.toLowerCase(), mesa: p[2] || '' };
  fetch('/livefood.html', { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (h) {
    h = h.replace(/<head>/i, '<head><base href="/"><script>window.LF_ROTA=' + JSON.stringify(rota) + '<\/script>');
    document.open(); document.write(h); document.close();
  }).catch(function () { location.replace('/livefood.html?c=' + encodeURIComponent(rota.c) + (rota.mesa ? '&mesa=' + rota.mesa : '')); });
})();
</script>
</head>
<body></body>
</html>
