<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LiveFood · Comercial</title>
<link rel="icon" type="image/svg+xml" href="/site/img/favicon-admin.svg">
<!-- Comercial do LiveFood: agenda de visitas, atendimento, propostas e catálogo. Fala com o Worker (rotas /comercial/*, a partir do 286). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
/* ───────── admin (mesma cara do admin.html) ───────── */
:root{
  --bg:#ECEEF1; --s1:#FFFFFF; --s2:#F7F8FA; --s3:#F1F2F5; --s4:#E6E8EC;
  --border:#E4E6EB; --border2:#D5D8DF;
  --text:#22252B; --texto2:#30343C; --muted:#8A8F9A; --muted2:#5C616C;
  --roxo:#D96D28; --roxo-esc:#914413; --grad:#FF5A00;
  --green:#16A34A; --red:#DC2626; --full:#00A650;
  --fbody:'Manrope',-apple-system,sans-serif;
  --r:16px; --sh1:0 1px 2px rgba(41,35,30,.05); --sh2:0 10px 26px -10px rgba(41,35,30,.14); --sh3:0 30px 70px -25px rgba(41,35,30,.32);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--fbody);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--fbody)}
button{cursor:pointer}
[hidden]{display:none!important}
.proto{background:#29231E;color:#fff;font-size:12px;font-weight:700;text-align:center;padding:7px 16px}
.proto b{color:#FFB27A}
.btn{border:1px solid var(--border2);background:var(--s3);color:var(--text);padding:9px 15px;border-radius:10px;font-weight:700;font-size:13px;transition:transform .15s,filter .15s,background .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--s4)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px -10px rgba(255,90,0,.7)}
.btn.pri:hover{filter:brightness(1.07);transform:translateY(-1px);background:var(--grad)}
.btn.peq{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.perigo{color:var(--red);background:#fff}
label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px;color:var(--texto2)}
input,select,textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border2);background:var(--s2);font-size:14px;color:var(--text)}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:#B6BAC3;font-style:italic}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--roxo);box-shadow:0 0 0 4px rgba(217,109,40,.10);background:#fff}
header.topo{min-height:64px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:8px 22px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.78);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
header.topo img{height:34px;display:block}
header.topo .papel{background:var(--grad);color:#fff;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:99px;letter-spacing:.6px}
header.topo .esp{flex:1}
.tb-av{width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
main{max-width:1240px;margin:0 auto;padding:26px 22px 60px}
.cab{margin-bottom:18px}
.cab h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px}.cab .sub{color:var(--muted);font-size:13px;margin-top:3px}
.abas{display:flex;gap:4px;margin:0 0 0 10px;padding:4px;background:var(--s3);border:1px solid var(--border);border-radius:12px;overflow-x:auto;scrollbar-width:none;max-width:max-content}
.abas::-webkit-scrollbar{display:none}
.aba{background:none;border:0;padding:8px 18px;font-weight:800;font-size:13.5px;color:var(--muted);border-radius:9px;white-space:nowrap}
.aba:hover{color:var(--roxo-esc)}
.aba.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px -10px rgba(255,90,0,.8)}
.finrow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;box-shadow:var(--sh1)}
.kpi .lb{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.kpi .vl{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.kpi .vl.vg{color:var(--green)}.kpi .vl.vo{color:var(--grad)}
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;box-shadow:var(--sh1)}
.card h3{margin:0 0 14px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card h3 .dir{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lnk{color:var(--roxo);font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;background:none;border:0;padding:0}.lnk:hover{text-decoration:underline}
.sub2{color:var(--muted);font-size:12.5px;font-weight:600}
.busca{width:250px;max-width:100%}
.chip{border:1.5px solid var(--border2);background:#fff;color:var(--muted2);border-radius:99px;padding:7px 13px;font-size:12px;font-weight:800;white-space:nowrap}
.chip:hover{color:var(--roxo);border-color:var(--roxo)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.tg{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tg.pend{background:#FEF3C7;color:#92400E}.tg.ok{background:#DCFCE7;color:#166534}.tg.neu{background:var(--s3);color:var(--roxo);border:1px solid var(--border2)}.tg.azul{background:#DBEAFE;color:#1E40AF}.tg.off{background:#F1F1F1;color:#777}
.full{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;font-style:italic;color:#fff;background:var(--full);border-radius:5px;padding:2px 6px;letter-spacing:.04em;white-space:nowrap}
.tabela-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:var(--s1)}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:12px 14px;background:var(--s2);letter-spacing:.5px;font-weight:800;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--border);vertical-align:middle}td.n,th.n{text-align:right;white-space:nowrap}
tr:hover td{background:var(--s2)}
.prod{display:flex;align-items:center;gap:12px;min-width:230px}
.prod img,.prod .semfoto{width:46px;height:46px;border-radius:10px;border:1px solid var(--border2);object-fit:contain;background:#fff;flex:none}
.semfoto{display:grid;place-items:center;color:var(--roxo)}
.semfoto svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prod b{display:block;font-weight:800}.prod small{color:var(--muted);font-size:12px}
.acs{display:flex;gap:6px;flex-wrap:nowrap}
.vazio{color:var(--muted);text-align:center;padding:28px}
.aviso{background:#FEF3C7;color:#92400E;padding:11px 13px;border-radius:10px;font-size:12.5px;margin:12px 0;border:1px solid #FDE68A;font-weight:600}
.info{background:var(--s3);color:var(--muted2);padding:11px 13px;border-radius:10px;font-size:12.5px;margin:0 0 14px;border:1px solid var(--border2);font-weight:600;line-height:1.5}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linha3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.fundo{position:fixed;inset:0;background:rgba(41,35,30,.42);backdrop-filter:blur(5px);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:20}
.fundo.on{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:580px;padding:24px;box-shadow:var(--sh3);border:1px solid var(--border)}
.modal h3{margin:0 0 4px;font-size:19px;font-weight:800}.modal .sub{color:var(--muted);font-size:12.5px;margin:0 0 6px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#29231E;color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;font-size:13px;display:none;z-index:90;box-shadow:var(--sh3);max-width:92vw;text-align:center}
.volta{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}

/* agenda */
.sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dia{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:8px;min-height:170px;display:flex;flex-direction:column;gap:6px}
.dia.hoje{border-color:var(--grad);background:#FFF6F0}
.dia .dh{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.dia .dh b{font-size:17px;color:var(--text);letter-spacing:0}
.dia.hoje .dh b{color:var(--grad)}
.vis{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--border2);border-left:4px solid var(--grad);border-radius:9px;padding:7px 8px;transition:transform .15s,box-shadow .15s}
.vis:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.vis.feita{border-left-color:var(--green)}
.vis .h{font-size:11.5px;font-weight:800;color:var(--roxo)}
.vis .c{font-weight:800;font-size:13px;line-height:1.2;margin:2px 0}
.vis .t{font-size:11px;color:var(--muted);font-weight:700}
.dia .nada{font-size:11.5px;color:#B6BAC3;font-weight:700;margin:auto;text-align:center}
.cli{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--sh1)}
.cli .av{width:42px;height:42px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
.cli .nome{font-weight:800;font-size:15px}.cli .id{color:var(--muted);font-size:12px;margin-top:2px}
.cli .dados{display:flex;gap:22px;flex-wrap:wrap;flex:1;color:var(--muted);font-size:12px}.cli .dados b{color:var(--text);font-size:14px;display:block;font-weight:800}

/* ficha */
.ficha{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.necs{display:flex;flex-wrap:wrap;gap:8px}
.nec{border:1.5px solid var(--border2);background:#fff;color:var(--muted2);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:800}
.nec.on{background:#FFF1E8;border-color:var(--grad);color:var(--roxo-esc)}
.nec.on::before{content:'✓ '}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.dl dt{color:var(--muted);font-weight:700}.dl dd{margin:0;font-weight:700}

/* montar proposta */
.montar{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.of{background:#fff;border:1px solid var(--border2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.of .ft{aspect-ratio:4/3;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden}
/* fotos presas ao quadro (posição absoluta) para nenhuma estourar nem ser cortada, em qualquer navegador */
.of .ft,.it .th,.ft-prev{position:relative}
.of .ft img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain}
.of .ft .semfoto{width:60px;height:60px;border:0;background:var(--s3)}
.of .full{position:absolute;left:14px;top:14px}
.of b{font-size:13px;line-height:1.25}
.of .pr{font-size:17px;font-weight:800}
.of small{color:var(--muted);font-size:11.5px;font-weight:700}
.of small.sj{color:var(--full)}
.of .btn{margin-top:auto}
.of.sel{border-color:var(--grad);box-shadow:0 0 0 3px rgba(255,90,0,.12)}
.resumo{position:sticky;top:80px}
.it{display:grid;grid-template-columns:52px 1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--border);align-items:center}
.it .th{width:52px;height:52px;border-radius:10px;border:1px solid var(--border2);background:#fff;display:grid;place-items:center;overflow:hidden;align-self:start}
.it .th img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}
.it .th svg{width:24px;height:24px;fill:none;stroke:var(--roxo);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.it:first-child{border-top:0}
.it b{font-size:13px}.it small{color:var(--muted);font-size:11.5px;font-weight:700;display:block}
.it .v{font-weight:800;text-align:right;white-space:nowrap}
.qt{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--border2);border-radius:9px;overflow:hidden;margin-top:4px}
.qt button{width:28px;height:26px;border:0;background:var(--s3);font-weight:800;color:var(--roxo)}
.qt span{min-width:28px;text-align:center;font-weight:800;font-size:13px}
.tira{background:none;border:0;color:var(--red);font-size:11.5px;font-weight:800;padding:0;margin-left:10px}
.tot{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted2);padding:4px 0}
.tot.g{font-size:18px;font-weight:800;color:var(--text);border-top:1px solid var(--border2);margin-top:6px;padding-top:10px}

.subabas{order:20;width:100%;display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--border);margin:0 -22px -8px;padding:0 22px;width:calc(100% + 44px)}
.subabas::-webkit-scrollbar{display:none}
.subabas button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 0 8px;font-weight:800;font-size:13.5px;color:var(--muted);white-space:nowrap}
.subabas button:hover{color:var(--text)}
.subabas button.on{color:var(--grad);border-bottom-color:var(--grad)}
.perfil{width:auto;padding:6px 10px;font-size:12px;font-weight:700;border-style:dashed}
.planobox.falta{border-color:var(--red);background:#FEF2F2}
.planobox.falta label{color:var(--red)}
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
#login[hidden]{display:none}
.lg{width:100%;max-width:380px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:30px 28px;box-shadow:var(--sh3)}
.lg img{height:38px;display:block;margin-bottom:18px}
.lg h2{margin:0 0 4px;font-size:22px;font-weight:800}
.lg-erro{color:var(--red);font-weight:700;font-size:13px;margin-top:10px;min-height:16px}
.sync{font-size:12px;font-weight:700;color:var(--muted)}
.sync.erro{color:var(--red)}
.pv-tela iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.ft-prev{width:64px;height:64px;border-radius:12px;border:1px solid var(--border2);background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.ft-prev img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}
/* necessidades (ficha) */
.necs{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.nc{border:1.5px solid var(--border2);background:#fff;border-radius:14px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.nc.on{border-color:var(--grad);background:#FFF6F0;box-shadow:0 0 0 3px rgba(255,90,0,.10)}
.nc-b{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;padding:12px 12px;color:var(--text)}
.nc-i{width:40px;height:40px;border-radius:11px;background:var(--s3);display:grid;place-items:center;font-size:20px;flex:none}
.nc.on .nc-i{background:#fff}
.nc-b b{display:block;font-size:13.5px;font-weight:800;line-height:1.2}
.nc-b small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;margin-top:2px;line-height:1.25}
.nc-ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:transparent}
.nc.on .nc-ck{background:var(--grad);border-color:var(--grad);color:#fff}
.nc-q{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px;padding:0 12px 11px 12px;font-size:12px;font-weight:800;color:var(--roxo-esc)}
.nc-q .qt{margin:0;background:#fff}
input[type=checkbox]{width:auto;padding:0;accent-color:var(--grad)}
.chk-l{max-height:210px;overflow:auto;border:1.5px solid var(--border2);border-radius:10px;padding:6px;background:var(--s2)}
.chk-l label{display:flex;align-items:center;gap:9px;margin:0;padding:7px 8px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.chk-l label:hover{background:#fff}
.chk-l small{color:var(--muted);font-weight:600;margin-left:auto;white-space:nowrap}
.chk-l .grp{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 8px 3px}
.nec-ic{width:40px;height:40px;border-radius:11px;background:var(--s3);display:grid;place-items:center;font-size:20px;flex:none}
.combo-l .grp{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 10px 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips span{display:inline-flex;align-items:center;gap:6px;background:#FFF1E8;border:1px solid #FFD2B8;color:var(--roxo-esc);border-radius:99px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:800}
.chips button{border:0;background:rgba(0,0,0,.08);color:inherit;width:20px;height:20px;border-radius:50%;font-size:13px;line-height:1;padding:0}
.com-l{display:grid;grid-template-columns:1fr 150px 110px;gap:8px;align-items:center;margin-bottom:8px}
.com-l span{font-size:13px;font-weight:700}.com-l small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
.com-l input,.com-l select{padding:9px 10px;font-size:13px}
button.tb-av{border:0;cursor:pointer}
.mapa{display:block;width:100%;height:230px;border:0;border-radius:12px;margin-top:14px;background:var(--s3)}
@media(max-width:520px){.com-l{grid-template-columns:1fr 1fr}.com-l span{grid-column:1/-1}}
/* seletor de clientes (nova visita) */
.combo{position:relative}
.combo input{padding-right:46px}
.combo-s{position:absolute;right:5px;top:5px;bottom:5px;width:36px;border:0;border-radius:8px;background:var(--s3);color:var(--muted2);font-size:14px}
.combo-s:hover{background:var(--s4)}
.combo-l{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:3;background:#fff;border:1.5px solid var(--border2);border-radius:12px;box-shadow:var(--sh2);max-height:230px;overflow:auto;padding:5px}
.combo-l button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--text)}
.combo-l button:hover,.combo-l button:focus-visible{background:var(--s3)}
.combo-l b{display:block;font-size:13.5px}.combo-l small{color:var(--muted);font-weight:600;font-size:12px}
.combo-l .nada{padding:10px;color:var(--muted);font-size:12.5px;font-weight:600}
.cli-sel{margin-top:10px;padding:11px 13px;border:1.5px solid var(--grad);background:#FFF6F0;border-radius:12px;font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center}
.cli-sel small{display:block;color:var(--muted2);font-weight:600;margin-top:2px}
.cli-sel .lnk{margin-left:auto}
.cli-novo{margin-top:10px;padding:2px 13px 13px;border:1.5px dashed var(--border2);border-radius:12px;background:var(--s2)}
/* busca da agenda */
.achados{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.achado{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border2);border-radius:12px;padding:10px 12px;color:var(--text)}
.achado:hover{border-color:var(--grad)}
.achado b{font-size:14px}.achado small{color:var(--muted);font-weight:700;display:block;font-size:12px}
.achado .tg{margin-left:auto}
.btn.zap{background:#1FAF5A;border-color:transparent;color:#fff}.btn.zap:hover{background:#19994E}
.planobox{margin-top:12px;padding:12px;border:1.5px dashed var(--border2);border-radius:12px;background:var(--s2)}
.planobox label{margin-top:0}
@media(max-width:900px){.abas{order:9;width:100%;max-width:100%;margin:0}}
@media(max-width:980px){.finrow{grid-template-columns:1fr 1fr}.ficha,.montar{grid-template-columns:1fr}.resumo{position:static}}
@media(max-width:760px){
  main{padding:18px 14px 50px}.card{padding:16px 14px}
  .sem{grid-template-columns:1fr}.dia{min-height:0}.dia .nada{margin:2px 0;text-align:left}
  .linha3{grid-template-columns:1fr}.card table{min-width:720px}
  .card h3 .dir{margin-left:0;width:100%}.busca{width:100%}
}

<script>
/* ───────── dados (vêm do servidor) ───────── */
/* ?api=... troca o servidor só em testes locais (localhost) */
var API=((location.hostname==='localhost'||location.hostname==='127.0.0.1')&&new URLSearchParams(location.search).get('api'))||'https://giro-os-api.nucleofull.workers.dev';
var HOJE=new Date(); HOJE.setHours(0,0,0,0);
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function seg(d){var x=new Date(d);var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
var SEG0=seg(HOJE);
var OFERTAS=[],SERVICOS=[],PRODUTOS=[],ALUGUEIS=[],NECS=[],PLANOS=[],CLIENTES=[],VISITAS=[],PROPOSTAS=[],EQUIPE=[],REPS=[],seq=1000,EU={nome:'',uid:''};
window._planosReais=true;
/* necessidades criadas sozinhas no primeiro acesso do administrador (ele vincula os itens e pode mudar tudo) */
var NECS_PADRAO=[
 {k:'caixa',n:'Caixa / PDV',d:'computador, tela e gaveta no balcão',i:'🖥️',q:'caixas',sug:[]},
 {k:'impressao',n:'Impressão de pedidos',d:'cozinha, bar e caixa',i:'🖨️',q:'pontos de impressão',sug:[]},
 {k:'garcom',n:'Garçom com celular',d:'pedido lançado direto na mesa',i:'📱',q:'celulares',sug:[]},
 {k:'totem',n:'Totem',d:'o cliente pede sozinho',i:'🤳',q:'totens',sug:[]},
 {k:'maquininha',n:'Maquininha',d:'cobrança integrada ao pedido',i:'💳',q:'maquininhas',sug:[]},
 {k:'delivery',n:'Delivery e WhatsApp',d:'pedidos pelo link e pelo Whats',i:'🛵',q:'',sug:[]},
 {k:'nf',n:'Nota fiscal',d:'nota emitida no caixa',i:'🧾',q:'',sug:[]},
 {k:'internet',n:'Internet',d:'rede, Wi-Fi ou Starlink',i:'📡',q:'',sug:[]}
];
function plano(id){for(var i=0;i<PLANOS.length;i++)if(String(PLANOS[i].id)===String(id))return PLANOS[i];return null}
/* parte variável do plano, com o mesmo texto do site: "+ R$ 0,19 por pedido", "acima de N inclusos" ou "N pedidos inclusos" (Worker 292) */
function planoVar(p){
  if(!p)return '';var c=Number(p.pedido)||0,f=Number(p.franquia)||0;
  if(c>0)return '+ R$ '+(c/100).toLocaleString('pt-BR',{minimumFractionDigits:(c%1)?3:2,maximumFractionDigits:3})+' por pedido'+(!p.vtotal&&f>0?' acima de '+f.toLocaleString('pt-BR')+' inclusos':'');
  return f>0?f.toLocaleString('pt-BR')+' pedidos inclusos':'';
}

/* ───────── servidor: login, carga e gravação ───────── */
var TOKEN='';try{TOKEN=localStorage.getItem('lf_com_jwt')||localStorage.getItem('lf_admin_jwt')||''}catch(e){}
async function api(m,c,b){
  try{
    var h={'Content-Type':'application/json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;
    var r=await fetch(API+c,{method:m,headers:h,body:b?JSON.stringify(b):undefined});
    var d=await r.json().catch(function(){return{}});d.http=r.status;return d;
  }catch(e){return{ok:false,http:0,mensagem:'Sem conexão com o servidor.'}}
}
function telaLogin(msg){el('app').hidden=true;el('login').hidden=false;el('lg-erro').textContent=msg||'';el('lg-btn').disabled=false;el('lg-btn').textContent='Entrar'}
async function entrar(){
  var e=el('lg-email').value.trim(),s=el('lg-senha').value;if(!e||!s){el('lg-erro').textContent='Informe o e-mail e a senha.';return}
  el('lg-btn').disabled=true;el('lg-btn').textContent='Entrando…';el('lg-erro').textContent='';
  TOKEN='';var d=await api('POST','/auth/login',{email:e,senha:s});
  if(!d.ok||!d.token){telaLogin(d.mensagem||'Não consegui entrar.');return}
  var p=d.usuario&&d.usuario.perfil;if(p!=='master'&&p!=='vendedor'){telaLogin('Esse usuário não tem acesso ao Comercial.');return}
  TOKEN=d.token;try{localStorage.setItem('lf_com_jwt',TOKEN)}catch(x){}
  el('lg-senha').value='';carregar();
}
function sair(){try{localStorage.removeItem('lf_com_jwt')}catch(e){}TOKEN='';telaLogin('')}
/* cada cadastro é uma linha no servidor. SNAP guarda a última versão gravada: depois de cada ação da tela, o que mudou é enviado */
var CAT={oferta:1,produto:1,servico:1,aluguel:1,nec:1,rep:1},SNAP={},carregado=false;   /* CAT: só o administrador grava */
function cols(){return{oferta:OFERTAS,produto:PRODUTOS,servico:SERVICOS,aluguel:ALUGUEIS,nec:NECS,rep:REPS,cliente:CLIENTES,visita:VISITAS,proposta:PROPOSTAS}}
async function carregar(){
  if(!TOKEN){telaLogin('');return}
  el('login').hidden=true;el('app').hidden=false;el('conteudo').innerHTML='<div class="vazio">Carregando…</div>';   /* a tela aparece na hora; os dados entram em seguida */
  var d=await api('GET','/comercial/tudo');
  if(!d.ok){telaLogin(d.http===401||d.http===403?'':(d.mensagem||'Não consegui carregar. Tente de novo.'));return}
  perfil=d.usuario.perfil;EU=d.usuario;seq=d.seq;
  PLANOS=(d.planos||[]).map(function(p){return{id:String(p.id),nome:p.nome,desc:p.descricao||'',preco:p.preco,pedido:Number(p.pedido_centavos)||0,franquia:Number(p.franquia)||0,vtotal:p.vtotal?1:0}});
  var x=d.docs||{};OFERTAS=x.oferta||[];PRODUTOS=x.produto||[];SERVICOS=x.servico||[];ALUGUEIS=x.aluguel||[];CLIENTES=x.cliente||[];VISITAS=x.visita||[];PROPOSTAS=x.proposta||[];REPS=x.rep||[];
  NECS=(x.nec||[]).sort(function(a,b){return (a.ordem||0)-(b.ordem||0)});
  var c=cols();for(var k in c){SNAP[k]={};c[k].forEach(function(o){SNAP[k][o.id]=JSON.stringify(o)})}
  if(perfil==='admin'&&!NECS.length)NECS=NECS_PADRAO.map(function(n){var o=JSON.parse(JSON.stringify(n));o.id=++seq;return o});
  if(perfil==='admin'){if(d.equipe)EQUIPE=d.equipe;else{var e=await api('GET','/comercial/equipe');EQUIPE=e.equipe||[]}}   /* Worker 288 já manda a equipe junto */
  el('login').hidden=true;el('app').hidden=false;
  el('av').textContent=(EU.nome||'?').charAt(0).toUpperCase();el('av').title=EU.nome||'';el('lk-admin').hidden=perfil!=='admin';
  carregado=true;desenhar();
}
var gravando=false,deNovo=false,tSync=null;
function avisoSync(txt,erro){var s=el('sync');s.textContent=txt;s.className='sync'+(erro?' erro':'')}
async function sincronizar(){
  if(!carregado)return;
  if(gravando){deNovo=true;return}
  gravando=true;clearTimeout(tSync);
  var falhou='',mudou=false,gravou=false;
  try{
    NECS.forEach(function(n,i){n.ordem=i});
    var c=cols();
    for(var col in c){
      if(CAT[col]&&perfil!=='admin')continue;
      var lista=c[col],vistos={};
      for(var i=0;i<lista.length;i++){
        var d=lista[i];vistos[d.id]=1;
        var js=JSON.stringify(d);if(SNAP[col][d.id]===js)continue;
        if(!gravou){gravou=true;avisoSync('Salvando…')}
        var r=await api('POST','/comercial/salvar',{col:col,doc:d});
        if(r.http===401){telaLogin('Sua sessão expirou. Entre de novo.');return}
        if(!r.ok){falhou=r.mensagem||'Não consegui salvar.';continue}
        if(JSON.stringify(d)===js){
          /* nada mudou na tela enquanto gravava: aceita o que o servidor completou (código da proposta, data, situação) */
          if(r.doc){for(var k in r.doc){if(JSON.stringify(d[k])!==JSON.stringify(r.doc[k])){d[k]=r.doc[k];mudou=true}}}
          SNAP[col][d.id]=JSON.stringify(d);
        }else{
          /* a pessoa alterou este cadastro enquanto a gravação estava a caminho: a versão da tela vale e é gravada em seguida.
             Do servidor só entram os campos que ele cria e a tela ainda não tem */
          if(r.doc){['slug','criada','dono'].forEach(function(k){if(r.doc[k]!==undefined&&d[k]===undefined){d[k]=r.doc[k];mudou=true}})}
          SNAP[col][d.id]=js;deNovo=true;
        }
      }
      for(var id in SNAP[col]){
        if(vistos[id])continue;
        if(!gravou){gravou=true;avisoSync('Salvando…')}
        var ra=await api('POST','/comercial/apagar',{col:col,id:+id});
        if(ra.ok)delete SNAP[col][id];else falhou=ra.mensagem||'Não consegui apagar.';
      }
    }
  }finally{gravando=false}
  if(falhou){avisoSync('Não salvou: '+falhou,true);tSync=setTimeout(sincronizar,15000)}
  else if(gravou)avisoSync('Tudo salvo');
  if(mudou&&!tela)desenhar();
  else if(deNovo){deNovo=false;sincronizar()}
}
function urlProp(p){return new URL('proposta.html?p='+encodeURIComponent(p.slug||''),location.href).href.replace(/([?&])api=[^&]*&?/,'$1')}
function zap(fone,msg){
  var d=String(fone||'').replace(/\D/g,'');if(d.length<10){toast('Esse cliente está sem WhatsApp com DDD.');return}
  if(d.length<=11)d='55'+d;
  window.open('https://wa.me/'+d+(msg?'?text='+encodeURIComponent(msg):''),'_blank','noopener');
}
/* foto: endereço de imagem ou arquivo (reduzido para caber no cadastro) */
function fotoCampo(atual){
  atual=atual||'';
  return '<label>Foto</label><div style="display:flex;gap:12px;align-items:center"><span class="ft-prev" id="ft-prev">'+(atual?'<img src="'+esc(atual)+'" alt="">':'')+'</span><div style="flex:1;min-width:0"><input id="ft-url" placeholder="cole o endereço da imagem (https://...)" value="'+(atual.indexOf('data:')===0?'':esc(atual))+'" oninput="fotoUrl(this.value)"><input type="file" accept="image/*" onchange="fotoArq(this.files[0])" style="margin-top:6px"></div></div><input type="hidden" id="ft-val" value="'+esc(atual)+'">';
}
function fotoUrl(v){v=v.trim();el('ft-val').value=v;el('ft-prev').innerHTML=v?'<img src="'+esc(v)+'" alt="">':''}
function fotoArq(f){
  if(!f)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    var d=c.toDataURL('image/jpeg',.82);el('ft-val').value=d;el('ft-url').value='';el('ft-prev').innerHTML='<img src="'+d+'" alt="">';
  };im.src=r.result};
  r.readAsDataURL(f);
}
function fotoVal(){var e=el('ft-val');return e?e.value:''}

/* ───────── utilidades ───────── */
function el(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function R(v){return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function parc(o){return o.parc+'x '+R(o.preco/o.parc)+' sem juros'}
function acha(l,id){for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}
function item(i){return i.t==='o'?acha(OFERTAS,i.id):i.t==='p'?acha(PRODUTOS,i.id):i.t==='a'?acha(ALUGUEIS,i.id):acha(SERVICOS,i.id)}
function mes(i){return i.t==='a'?'/mês':''}
function ico(i,x){return x.img?'<img src="'+x.img+'" alt="">':i.t==='s'?IC_SERV:i.t==='p'?IC_NFC:IC_CX}
function somas(itens){var p=0,s=0,m=0;itens.forEach(function(i){var x=item(i);if(!x)return;if(i.t==='o')p+=x.preco*i.q;else if(i.t==='a')m+=x.preco*i.q;else s+=x.preco*i.q});return{p:p,s:s,t:p+s,m:m}}
function dataBr(s){var p=s.split('-');return p[2]+'/'+p[1]}
function dh(ts,sep){var d=new Date(ts||Date.now()),z=function(n){return ('0'+n).slice(-2)};return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+(sep||' às ')+z(d.getHours())+':'+z(d.getMinutes())}
function sem(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function ha(min){return min<1?'agora':min<60?'há '+min+' min':'há '+Math.round(min/60)+' h'}
var tT;function toast(m){var t=el('toast');t.textContent=m;t.style.display='block';clearTimeout(tT);tT=setTimeout(function(){t.style.display='none'},2600)}
function abrir(h){el('modal').innerHTML=h;el('fundo').classList.add('on')}
function fechar(){el('fundo').classList.remove('on')}
var IC_SERV='<svg viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5 5L4 17l3 3 5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>';
var IC_CX='<svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>';
var IC_NFC='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M9 15a4 4 0 0 0 0-6M12 17a7 7 0 0 0 0-10M15 15.5a5 5 0 0 0 0-7"/></svg>';
function foto(o){return o.img?'<img src="'+o.img+'" alt="">':'<span class="semfoto">'+IC_CX+'</span>'}
var TG={agendada:'<span class="tg pend">Agendada</span>',atendida:'<span class="tg ok">Atendida</span>',rascunho:'<span class="tg neu">Rascunho</span>',enviada:'<span class="tg azul">Enviada</span>',aprovada:'<span class="tg ok">Aprovada</span>'};

/* ───────── navegação ───────── */
/* Comercial tem dois caminhos: Proposta Comercial (admin e representante) e Catálogo de produtos (só admin) */
var SECOES=[['prop','Proposta Comercial',[['agenda','Agenda'],['atend','Atendimentos'],['prop','Propostas']]],['cat','Catálogo de produtos',[['ofertas','Mercado Livre'],['prods','Produtos LiveFood'],['serv','Implantação e serviços'],['alug','Aluguel de equipamentos'],['necs','Necessidades do cliente']]],['equipe','Equipe',[['equipe','Representantes']]]];
var aba='agenda',tela=null,semOff=0,perfil='admin';
function secDe(a){for(var i=0;i<SECOES.length;i++)for(var j=0;j<SECOES[i][2].length;j++)if(SECOES[i][2][j][0]===a)return SECOES[i];return SECOES[0]}
function ir(a){aba=a;tela=null;desenhar()}
function desenhar(){
  if(perfil==='rep'&&secDe(aba)[0]!=='prop'){aba='agenda';tela=null}
  var sec=secDe(aba);
  el('papel').textContent=perfil==='rep'?'REPRESENTANTE':'ADMIN';
  el('abas').innerHTML=SECOES.filter(function(s){return perfil==='admin'||s[0]==='prop'}).map(function(s){return '<button class="aba'+(s===sec?' on':'')+'" onclick="ir(\''+s[2][0][0]+'\')">'+s[1]+'</button>'}).join('');
  el('subabas').innerHTML=sec[2].map(function(a){return '<button class="'+(a[0]===aba&&!tela?'on':'')+'" onclick="ir(\''+a[0]+'\')">'+a[1]+'</button>'}).join('');
  var h='';
  if(tela&&tela.t==='ficha')h=vFicha(tela.id);
  else if(tela&&tela.t==='montar')h=vMontar();
  else if(tela&&tela.t==='painel')h=vPainel(tela.uid);
  else h={agenda:vAgenda,atend:vAtend,prop:vProp,ofertas:vOfertas,prods:vProdutos,serv:vServ,alug:vAlug,necs:vNecs,equipe:vEquipe}[aba]();
  el('conteudo').innerHTML=h;
  sincronizar();
}

/* ───────── agenda ───────── */
var DS=['seg','ter','qua','qui','sex','sáb','dom'],MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function vAgenda(){
  var ini=new Date(SEG0);ini.setDate(ini.getDate()+semOff*7);var fim=new Date(ini);fim.setDate(fim.getDate()+6);
  var noPer=VISITAS.filter(function(v){return v.data>=iso(ini)&&v.data<=iso(fim)});
  var h='<div class="finrow">'+
   kpi('Visitas na semana',noPer.length,'')+kpi('Atendimentos feitos',VISITAS.filter(function(v){return v.status==='atendida'}).length,'')+
   kpi('Propostas enviadas',PROPOSTAS.filter(function(p){return p.status!=='rascunho'}).length,'vo')+kpi('Aprovadas',PROPOSTAS.filter(function(p){return p.status==='aprovada'}).length,'vg')+'</div>';
  h+='<div class="card"><h3><span>Semana de '+ini.getDate()+(ini.getMonth()!==fim.getMonth()?' '+MES[ini.getMonth()]:'')+' a '+fim.getDate()+' de '+MES[fim.getMonth()]+'</span>'+

function sugerir(v){
  var f=v.ficha||{nec:{}},n=f.nec||{},it=[];
  NECS.forEach(function(nc){var q=n[nc.k]||0;if(!q)return;
    (nc.sug||[]).forEach(function(s){var t=s.split(':')[0],id=+s.split(':')[1];if(!item({t:t,id:id}))return;
      var ja=it.filter(function(x){return x.t===t&&x.id===id})[0];if(ja)ja.q+=q;else it.push({t:t,id:id,q:q})})});
  /* implantação padrão (a primeira ativa do catálogo) só entra se nenhuma necessidade marcada já trouxe uma implantação: senão vinha em dobro */
  var temImpl=it.some(function(x){if(x.t!=='s')return false;var sv=acha(SERVICOS,x.id);return !!sv&&sv.tipo==='impl'});
  if(!temImpl){var im=SERVICOS.filter(function(x){return x.tipo==='impl'&&x.ativo})[0];if(im)it.push({t:'s',id:im.id,q:1})}
  return it;
}

/* Mercado Livre: conta conectada no Worker (a partir do 289). Colou o link, tocou em Buscar, os campos são preenchidos */
var ML_ST=null;
async function mlMostra(){
  if(!el('of-ml'))return;
  if(!ML_ST||!ML_ST.ok)ML_ST=await api('GET','/comercial/ml/status');
  var c=el('of-ml'),s=ML_ST;if(!c)return;
  if(s.http===0)c.textContent='Sem conexão com o servidor. Você pode preencher à mão.';
  else if(!s.ok)c.textContent='A busca automática entra com o Worker 289. Enquanto isso, preencha os campos à mão.';
  else if(!s.configurado)c.innerHTML='Busca automática desligada: falta criar o aplicativo no Mercado Livre e guardar <b>ML_CLIENT_ID</b> e <b>ML_CLIENT_SECRET</b> no Cloudflare. Enquanto isso, preencha os campos à mão.';
  else if(!s.conectado)c.innerHTML='A conta do Mercado Livre ainda não está conectada. <button class="lnk" onclick="mlConectar()">Conectar agora</button>';
  else c.innerHTML='✓ Mercado Livre conectado'+(s.conta?' ('+esc(s.conta)+')':'')+'.';
}
async function mlConectar(){
  var r=await api('GET','/comercial/ml/conectar');if(!r.ok){toast(r.mensagem||'Não consegui iniciar a conexão.');return}
  ML_ST=null;window.open(r.url,'_blank','noopener');
  var c=el('of-ml');if(c)c.innerHTML='Autorize na aba que abriu. Depois, <button class="lnk" onclick="ML_ST=null;mlMostra()">toque aqui para conferir</button>.';
}
async function mlBuscar(){
  var u=el('of-link').value.trim(),b=el('of-buscar');
  if(!/^https?:\/\//i.test(u)){toast('Cole o link do produto (começa com https://).');return}
  b.disabled=true;b.textContent='Buscando…';
  var r=await api('POST','/comercial/ml-ler',{url:u});
  b=el('of-buscar');var c=el('of-ml');if(!b||!c)return;
  b.disabled=false;b.textContent='Buscar';
  if(!r.ok){c.innerHTML='<span style="color:var(--red)">'+esc(r.http===404?'A busca automática entra com o Worker 289.':(r.mensagem||'Não consegui buscar.'))+'</span> Você pode preencher os campos à mão.';return}
  var d=r.dados||{};
  if(d.nome)el('of-nome').value=d.nome;
  if(d.preco>0)el('of-preco').value=d.preco;
  el('of-full').value=d.full?'1':'0';el('of-usado').value=d.usado?'1':'0';
  if(d.img){el('ft-url').value=d.img;fotoUrl(d.img)}
  window._ofMl=d.ml||null;
  c.innerHTML='✓ Dados trazidos do Mercado Livre. Confira as <b>parcelas sem juros</b>, que não vêm automáticas.'+(/\/sec\/|meli\.la/i.test(u)?'':' <b style="color:var(--red)">Esse não parece ser o seu link de afiliado. Troque o link acima pelo de afiliado antes de salvar, para a comissão ser sua.</b>');
}
function salvarOf(id){
  var nome=el('of-nome').value.trim(),link=el('of-link').value.trim(),preco=+el('of-preco').value||0;
  if(!nome){toast('Informe o nome do produto.');return}
  if(!(preco>0)){toast('Informe o preço que aparece no Mercado Livre.');return}
  if(!/^https?:\/\//i.test(link)){toast('Informe o seu link de afiliado (começa com https://).');return}
  var d={nome:nome,det:el('of-det').value.trim(),preco:preco,parc:Math.max(1,Math.round(+el('of-parc').value||1)),full:el('of-full').value==='1',usado:el('of-usado').value==='1',link:link,img:fotoVal(),desc:el('of-desc').value.split('\n').map(function(x){return x.trim()}).filter(Boolean),cat:el('of-cat').value,loja:el('of-loja').value==='1'};
  if(window._ofMl)d.ml=window._ofMl;   /* código do anúncio: é o que vai permitir atualizar o preço sozinho */
  var o=id?acha(OFERTAS,id):null;
  if(o){if(o.preco!==d.preco||o.parc!==d.parc||!o.conferido)d.conferido=Date.now();for(var k in d)o[k]=d[k]}
  else{d.id=++seq;d.conferido=Date.now();OFERTAS.push(d);o=d}
  necSalva('o',o.id);fechar();toast('Oferta salva.');desenhar();
}
function excluirOf(id){OFERTAS=OFERTAS.filter(function(o){return o.id!==id});PROPOSTAS.forEach(function(p){p.itens=p.itens.filter(function(i){return !(i.t==='o'&&i.id===id)})});fechar();toast('Oferta excluída.');desenhar()}

   '<label>Comissão</label>'+COM_TIPOS.map(function(t){var r=(c.com||{})[t[0]]||{t:'n',v:0};
     return '<div class="com-l"><span>'+t[1]+'<small>'+t[2]+'</small></span><select id="rc-t-'+t[0]+'" aria-label="Tipo de comissão: '+t[1]+'"><option value="n">Não paga</option><option value="%"'+(r.t==='%'?' selected':'')+'>% do valor</option><option value="R"'+(r.t==='R'?' selected':'')+'>R$ por projeto</option></select><input id="rc-v-'+t[0]+'" type="number" min="0" step="0.01" value="'+(r.v||'')+'" placeholder="valor" aria-label="Valor: '+t[1]+'"></div>'}).join('')+

  rcChips();rcCidades();
}

/* comissão de uma proposta pelas regras do representante. Bases: implantação e serviços; equipamentos (ML + produtos LiveFood); plano (mensal); locação (mensal) */
function comissao(p,c){
  var b={impl:0,equip:0,mens:0,alug:0},o={uma:0,mes:0};
  p.itens.forEach(function(i){var x=item(i);if(!x)return;var v=x.preco*i.q;if(i.t==='s')b.impl+=v;else if(i.t==='a')b.alug+=v;else b.equip+=v});
  var pl=plano(p.plano);if(pl)b.mens=pl.preco;
  if(!c||!c.com)return o;
  COM_TIPOS.forEach(function(t){var r=c.com[t[0]],k=t[0];if(!r||r.t==='n'||!(r.v>0)||!(b[k]>0))return;
    if(r.t==='R')o.uma+=r.v;else if(k==='mens'||k==='alug')o.mes+=b[k]*r.v/100;else o.uma+=b[k]*r.v/100});
  return o;
}
function comStr(o){return (o.uma?R(o.uma):'')+(o.uma&&o.mes?' + ':'')+(o.mes?R(o.mes)+'/mês':'')||'—'}

function salvarAlug(id){
  var n=el('al-nome').value.trim();if(!n){toast('Informe o nome do equipamento.');return}
  var d={nome:n,det:el('al-det').value.trim(),desc:el('al-desc').value.split('\n').map(function(x){return x.trim()}).filter(Boolean),preco:+el('al-preco').value||0,min:+el('al-min').value||1,img:fotoVal(),ativo:el('al-ativo').value==='1'};
  if(id){var s=acha(ALUGUEIS,id);for(var k in d)s[k]=d[k]}else{d.id=++seq;ALUGUEIS.push(d)}
  necSalva('a',id||d.id);fechar();toast('Equipamento salvo.');desenhar();
}

/* ───────── produtos LiveFood (plaquinhas, cartões) ───────── */
function vProdutos(){
  return '<div class="card"><h3><span>Produtos LiveFood</span><span class="sub2">itens personalizados vendidos direto pelo LiveFood</span><span class="dir"><button class="lnk" onclick="novoProd()">+ Novo produto</button></span></h3>'+
   '<div class="tabela-wrap"><table><thead><tr><th>Produto</th><th>O que inclui</th><th class="n">Preço</th><th>Vendido por</th><th>Situação</th><th>Ações</th></tr></thead><tbody>'+
   PRODUTOS.map(function(s){return '<tr><td><div class="prod">'+(s.img?foto(s):'<span class="semfoto">'+IC_NFC+'</span>')+'<div><b>'+esc(s.nome)+'</b><small>'+esc(s.det)+'</small></div></div></td><td class="sub2" style="max-width:340px">'+esc(s.desc.join(' · '))+'</td><td class="n"><b>'+R(s.preco)+'</b></td><td>'+esc(s.un)+'</td><td><span class="tg '+(s.ativo?'ok':'off')+'">'+(s.ativo?'Ativo':'Pausado')+'</span></td><td><button class="btn peq" onclick="novoProd('+s.id+')">Editar</button></td></tr>'}).join('')+
   '</tbody></table></div></div>';
}
function novoProd(id){
  var s=id?acha(PRODUTOS,id):null;
  abrir('<h3>'+(s?'Editar produto':'Novo produto')+'</h3><p class="sub">Produtos do LiveFood entram na proposta com o seu preço, fora do Mercado Livre.</p>'+
   '<label>Nome</label><input id="pd-nome" value="'+esc(s?s.nome:'')+'" placeholder="ex.: Plaquinha de mesa com NFC">'+
   '<label>Resumo (aparece na proposta)</label><input id="pd-det" value="'+esc(s?s.det:'')+'" placeholder="ex.: personalizada com a logo">'+
   '<label>O que inclui (uma linha por item)</label><textarea id="pd-desc">'+esc(s?s.desc.join('\n'):'')+'</textarea>'+
   fotoCampo(s?s.img:'')+
   '<label>Condição</label><select id="pd-usado"><option value="0">Novo</option><option value="1"'+(s&&s.usado?' selected':'')+'>Usado</option></select>'+
   '<div class="linha3"><div><label>Preço (R$)</label><input id="pd-preco" type="number" min="0" step="0.01" value="'+(s?s.preco:'')+'"></div><div><label>Vendido por</label><select id="pd-un"><option'+(s&&s.un==='unidade'?' selected':'')+'>unidade</option><option'+(s&&s.un==='pacote com 50'?' selected':'')+'>pacote com 50</option><option'+(s&&s.un==='pacote com 100'?' selected':'')+'>pacote com 100</option></select></div><div><label>Situação</label><select id="pd-ativo"><option value="1">Ativo</option><option value="0"'+(s&&!s.ativo?' selected':'')+'>Pausado</option></select></div></div>'+
   necChecks('p',s?s.id:0)+
   '<div class="acoes"><button class="btn" onclick="fechar()">Cancelar</button><button class="btn pri" onclick="salvarProd('+(s?s.id:0)+')">Salvar produto</button></div>');
}
function salvarProd(id){
  var n=el('pd-nome').value.trim();if(!n){toast('Informe o nome do produto.');return}
  var d={nome:n,det:el('pd-det').value.trim(),desc:el('pd-desc').value.split('\n').map(function(x){return x.trim()}).filter(Boolean),preco:+el('pd-preco').value||0,un:el('pd-un').value,usado:el('pd-usado').value==='1',img:fotoVal(),ativo:el('pd-ativo').value==='1'};
  if(id){var s=acha(PRODUTOS,id);for(var k in d)s[k]=d[k]}else{d.id=++seq;PRODUTOS.push(d)}
  necSalva('p',id||d.id);fechar();toast('Produto salvo.');desenhar();
}

function pvAbrir(p){
  if(!p.slug){toast('A proposta ainda está sendo salva. Tente de novo em um instante.');return}
  pvP=p;el('pv').classList.add('on');el('pv-url').textContent=urlProp(p).replace(/^https?:\/\//,'');pvModo(innerWidth<760?'cel':pvM);
}
function pvFechar(){el('pv').classList.remove('on');el('pv-tela').innerHTML=''}
function pvModo(m){
  pvM=m;el('pv-tela').className='pv-tela '+m;el('pv-cel').classList.toggle('on',m==='cel');el('pv-desk').classList.toggle('on',m==='desk');
  var a=new URLSearchParams(location.search).get('api');
  el('pv-tela').innerHTML='<iframe title="Proposta do cliente" src="proposta.html?p='+encodeURIComponent(pvP.slug)+'&previa=1'+(a?'&api='+encodeURIComponent(a):'')+'"></iframe>';
}
addEventListener('keydown',function(e){if(e.key==='Escape'&&el('fundo').classList.contains('on'))fechar()});
carregar();
