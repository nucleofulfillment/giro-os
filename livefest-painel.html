<style>

.fh{aspect-ratio:2/1;width:100%;border-radius:14px;background:#F6EDF3 center/cover no-repeat;border:2px dashed #EBB6D6;display:flex;align-items:center;justify-content:center;color:#C2187F;font-weight:800;font-size:13px;cursor:pointer;text-align:center;padding:10px}

.capa{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}

.fv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.fv .pv{position:absolute;left:10px;right:10px;bottom:12px;z-index:1}

.fv .pv b{display:block;font:800 17px/1.05 var(--t);margin:5px 0 7px}
.fv .pv span{display:block;text-align:center;background:#fff;color:#0E0A12;border-radius:9px;font-size:10px;font-weight:800;padding:6px}
.fv .vz2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-weight:800;font-size:12px;opacity:.8;z-index:1}
.capa .ct{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.bts{display:flex;gap:6px;flex-wrap:wrap}
.salvar{position:sticky;bottom:14px;z-index:5;display:flex;align-items:center;gap:12px;margin-top:4px}
.salvar .btn{padding:12px 26px;font-size:15px;box-shadow:0 10px 24px -10px rgba(224,36,154,.7)}.salvar span{font-size:12.5px;color:var(--mu);font-weight:700;background:#fff;border-radius:99px;padding:6px 12px;box-shadow:0 4px 14px -8px rgba(40,10,40,.4)}
#ed-mapa{height:250px;border-radius:14px;margin-top:10px;background:var(--s2);z-index:0}
.pin{font-size:30px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
/* salões e setores */
.sal{border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin-bottom:12px;background:#fff}
.sal .sh{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--s1);flex-wrap:wrap}
.sal .sh b{font-size:15px;flex:1}.sal .sh small{font-size:12px;color:var(--mu);font-weight:700}
.st{display:grid;grid-template-columns:1.4fr 1.6fr .8fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--bd);font-size:13px;font-weight:700}
.st small{display:block;color:var(--mu);font-weight:600;font-size:11.5px}
.tp{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;margin-right:4px;background:var(--s2)}
.lts{display:flex;gap:5px;flex-wrap:wrap}.lts span{font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--s2)}.lts span.at{background:#FFF1E8;color:#E04A00}
.lote{display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1fr auto;gap:6px;margin-top:6px;align-items:end}
.erro{color:var(--er);font-weight:800;font-size:13px;min-height:18px;margin-top:8px}
.vd{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bd);font-size:13.5px;font-weight:700}.vd:first-child{border-top:0}.vd div{flex:1}.vd small{display:block;color:var(--mu);font-weight:600}
.fundo{position:fixed;inset:0;background:rgba(14,10,18,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.folha{background:#fff;border-radius:20px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:18px}
.folha h2{margin:0 0 10px;font-size:19px}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px 10px}.mesas small{color:var(--mu);font-weight:600}
.vazio{padding:28px;text-align:center;color:var(--mu);font-weight:700;background:#fff;border-radius:18px}
.link{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--s1);border:1.5px solid #E2E2E6;border-radius:14px;padding:10px 10px 10px 14px;font-weight:800;font-size:15px}
.link span{flex:1;min-width:0;word-break:break-all}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--noite);color:#fff;font-weight:800;font-size:14px;padding:10px 16px;border-radius:99px}
.live-mascote{position:relative;width:100%;aspect-ratio:220/230}.live-corpo{position:absolute;inset:0;transform-origin:50% 46%}.live-corpo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.live-rosto{position:absolute;border-radius:14% / 18%}.live-sombra{position:absolute;left:22%;right:22%;bottom:-6%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent)}
@media (max-width:900px){.col2{grid-template-columns:1fr}}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}.st{grid-template-columns:1fr}.lote{grid-template-columns:1fr 1fr}.fv{width:150px}}
</style>
</head>
<body>
<div class="lay">
  <aside class="side">
    <div class="sb"><div class="lv" id="lv" aria-hidden="true"></div><div><span class="marca">live<i>fest</i></span><small id="loja">Painel do evento</small></div></div>
    <nav id="nav"><button data-v="eventos" class="on">🎉 Meus eventos</button><button data-v="vendas">💰 Vendas</button><button data-v="pagina">🔗 Minha página</button></nav>
    <a class="hub" href="hub.html"><svg class="seta" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>Hub</a>

</div>
<div class="toast" id="toast" hidden></div>
<script src="site/js/live-mascote.js"></script>
<script>
/* (183) o Live de ajuda do Painel, aqui no painel do evento: o chat usa o mesmo login e o manual já fala da LiveFest */
var DELTADIS_API='https://giro-os-api.nucleofull.workers.dev', DD_TOKEN='', DD_USER=null, PAG='livefest';
try{ DD_TOKEN=localStorage.getItem('dd_jwt')||''; DD_USER=JSON.parse(localStorage.getItem('dd_user')||'null'); }catch(e){}
function cdHdr(){ return {'Content-Type':'application/json','Authorization':'Bearer '+DD_TOKEN}; }
function mpLiveCarregar(cb){ if(window.LiveMascote){ cb(); return; } var s=document.createElement('script'); s.src='site/js/live-mascote.js'; s.onload=cb; document.head.appendChild(s); }
</script>
<script src="live-ajuda.js"></script>
<script>
var API='https://giro-os-api.nucleofull.workers.dev', TK='', US=null, D=null, EV=null, ABA='dados', VISTA='eventos', live=null;
var SETA='<svg class="seta" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>';
try{ TK=localStorage.getItem('dd_jwt')||''; US=JSON.parse(localStorage.getItem('dd_user')||'null'); }catch(e){}
if(!TK) location.replace('hub.html');
function el(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function brl(v){ return 'R$ '+Number(v||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function dt(i){ i=String(i||''); return i.slice(8,10)+'/'+i.slice(5,7); }
var tT=null; function toast(m){ var t=el('toast'); t.textContent=m; t.hidden=false; clearTimeout(tT); tT=setTimeout(function(){ t.hidden=true; },3200); }
function api(c,b){ var h={'Authorization':'Bearer '+TK}; if(b) h['Content-Type']='application/json'; return fetch(API+c,b?{method:'POST',headers:h,body:JSON.stringify(b)}:{headers:h,cache:'no-store'}).then(function(r){ if(r.status===401){ location.replace('hub.html'); throw new Error('sessao'); } return r.json(); }); }
function diz(t){ if(live) try{ live.falar(t,40); }catch(e){} }
function hoje(){ return new Date(Date.now()-3*3600000).toISOString().slice(0,10); }
if(US&&US.cliente_nome) el('loja').textContent=US.cliente_nome;
try{ if(window.LiveMascote){ live=LiveMascote.criar(el('lv'),{rotulo:'Live'}); live.expressao('feliz'); } }catch(e){}
/* campos de data vazios ficam apagados, como os exemplos dos outros campos */
/* (189) tocar em qualquer parte do campo de data ou hora abre o calendário; embaixo da data aparece o dia da semana por extenso */
var SEMANA=['domingo','segunda','terça','quarta','quinta','sexta','sábado'], MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function diaSemana(i){ var s=i.nextElementSibling; if(!s||!s.classList.contains('dsem')){ s=document.createElement('small'); s.className='dsem'; i.insertAdjacentElement('afterend',s); } var v=i.value; s.textContent=/^\d{4}-\d{2}-\d{2}$/.test(v)?SEMANA[new Date(v+'T12:00:00').getDay()]+', '+(+v.slice(8,10))+' de '+MESES[+v.slice(5,7)-1]:''; }
function datasVazias(){ [].forEach.call(document.querySelectorAll('input[type=date].inp'),function(i){ i.classList.toggle('vz',!i.value); diaSemana(i); }); }
document.addEventListener('input',function(e){ if(e.target&&e.target.type==='date'){ e.target.classList.toggle('vz',!e.target.value); diaSemana(e.target); } });
document.addEventListener('change',function(e){ if(e.target&&e.target.type==='date') diaSemana(e.target); });
document.addEventListener('click',function(e){ var i=e.target; if(i&&i.tagName==='INPUT'&&(i.type==='date'||i.type==='time')&&i.showPicker){ try{ i.showPicker(); }catch(x){} } });
[].forEach.call(document.querySelectorAll('#nav button'),function(b){ b.onclick=function(){ VISTA=b.dataset.v; EV=null; pinta(); scrollTo(0,0); }; });
var TIPOS={pista:'Pista',mesa:'Mesa',camarote:'Camarote',backstage:'Backstage',vip:'VIP',outro:'Outro'};
function carrega(id,quieto){ return api('/painel/fest-eventos').then(function(d){ if(!d.ok) throw new Error(d.mensagem||''); D=d; if(id) EV=D.eventos.filter(function(e){ return e.id===id; })[0]||null; if(!quieto) pinta(); }).catch(function(e){ if(e.message!=='sessao') el('app').innerHTML='<div class="vazio">'+esc(e.message||'Não consegui carregar.')+'</div>'; }); }
function linkCasa(){ return 'https://livefood.tec.br/livefest/'+encodeURIComponent(D.slug||D.cli||''); }
function linkEv(e){ return linkCasa()+'/'+encodeURIComponent(e.slug||e.id); }
function copiar(t){ try{ navigator.clipboard.writeText(t).then(function(){ toast('Link copiado'); },function(){ prompt('Copie o link:',t); }); }catch(e){ prompt('Copie o link:',t); } }
function avisos(){
  var h=''; if(!D.liberada) h+='<div class="aviso">Sua casa ainda não está liberada para vender na LiveFest. Você já pode montar o evento; para publicar, fale com o LiveFood.</div>';
  if(!D.asaas) h+='<div class="aviso er">Ligue a conta de pagamento (Asaas) em Painel › Configurações › Formas de pagamento. O valor dos ingressos cai direto nela.</div>';
  return h;
}
function comissao(){ var c=D.comissao; return '<p class="info">Comissão LiveFood: '+String(c.pct).replace('.',',')+'% por ingresso (mínimo '+brl(c.min)+'), '+(c.modelo==='casa'?'descontada do seu valor':'paga pelo cliente como taxa')+'.</p>'; }
function pinta(){
  [].forEach.call(document.querySelectorAll('#nav button'),function(b){ b.classList.toggle('on',b.dataset.v===VISTA); });
  if(EV) return evento(); if(VISTA==='vendas') return vendasTodas(); if(VISTA==='pagina') return pagina(); lista();
}
/* números de um evento: vendidos (pagos) e o total à venda nos setores */
function conta(e){ var nS=0, cap=0; e.saloes.forEach(function(s){ nS+=s.setores.length; s.setores.forEach(function(x){ cap+=x.qtd||0; }); }); return {setores:nS,cap:cap}; }
function situacao(e){ return e.fim<hoje()?'<i class="tag fim">Encerrado</i>':e.pub?'<i class="tag pub">À venda</i>':'<i class="tag ras">Rascunho</i>'; }
function lista(){
  var ev=D.eventos, av=ev.filter(function(e){ return e.pub&&e.fim>=hoje(); }).length, tot=0, ing=0, casa=0;

  var h=e.saloes.map(function(s){ var an=(ar.filter(function(a){ return a.id===s.area; })[0]||{}).nome;
    return '<div class="sal"><div class="sh"><b>'+esc(s.nome)+'</b><small>'+(s.capacidade?s.capacidade+' pessoas':'')+(an?' · área do mapa: '+esc(an):'')+'</small><button class="btn sm" onclick="salao(\''+esc(s.id)+'\')">Editar</button><button class="btn sm pri" onclick="setor(\''+esc(s.id)+'\')">+ Setor</button></div>'+
      (s.setores.length?s.setores.map(function(x){ return '<div class="st"><div><span class="tp">'+esc(TIPOS[x.tipo]||x.tipo)+'</span>'+esc(x.nome)+'<small>'+[x.pessoas>1?x.pessoas+' pessoas':'',x.consumacao?brl(x.consumacao)+' de consumação':'',x.meia?'meia-entrada':'',x.mesas&&x.mesas.length?x.mesas.length+' mesas no 3D':'',x.inclui].filter(Boolean).map(esc).join(' · ')+'</small></div><div class="lts">'+x.lotes.map(function(l){ return '<span class="'+(l.nome===x.lote?'at':'')+'">'+esc(l.nome)+' · '+brl(l.preco)+'</span>'; }).join('')+'</div><div>'+x.vendidos+(x.qtd?' / '+x.qtd:'')+'<small>vendidos</small></div><button class="btn sm" onclick="setor(\''+esc(s.id)+'\',\''+esc(x.id)+'\')">Editar</button></div>'; }).join(''):'<div class="st" style="color:var(--mu)">Nenhum setor ainda. Toque em + Setor.</div>')+'</div>'; }).join('');
  el('corpo').innerHTML=(h||'<div class="vazio">Crie o primeiro salão. Ex.: Salão Principal, Rooftop.</div>')+'<button class="btn pri" style="margin-top:6px" onclick="salao()">+ Salão</button>';
  if(!e.saloes.length) diz('Comece criando um salão.');
}
function salao(id){
  var s=id?EV.saloes.filter(function(x){ return x.id===id; })[0]:{nome:'',area:'',capacidade:''};
  folha('<h2>'+(id?'Editar salão':'Novo salão')+'</h2><label class="cp">Nome<input class="inp" id="sl-nm" maxlength="60" value="'+esc(s.nome)+'" placeholder="Ex.: Salão Principal"></label><div class="g2" style="margin-top:8px"><label class="cp">Área do mapa do salão (para mesas e camarotes)<select class="inp" id="sl-ar"><option value="">Nenhuma</option>'+(D.areas||[]).map(function(a){ return '<option value="'+esc(a.id)+'"'+(a.id===s.area?' selected':'')+'>'+esc(a.nome)+'</option>'; }).join('')+'</select></label><label class="cp">Capacidade<input class="inp" id="sl-cp" inputmode="numeric" value="'+esc(s.capacidade||'')+'" placeholder="Ex.: 400"></label></div><div class="erro" id="sl-er"></div><div style="display:flex;gap:8px;justify-content:space-between">'+(id?'<button class="btn er" onclick="apagaSalao(\''+esc(id)+'\')">Excluir</button>':'<span></span>')+'<span><button class="btn" onclick="fecha()">Cancelar</button> <button class="btn pri" onclick="salvaSalao(\''+(id||'')+'\')">Salvar</button></span></div>');
}
function salvaSalao(id){ api('/painel/fest-salao',{id:id||undefined,evento:EV.id,nome:el('sl-nm').value,area:el('sl-ar').value,capacidade:el('sl-cp').value}).then(function(d){ if(!d.ok){ el('sl-er').textContent=d.mensagem||'Não consegui salvar.'; return; } fecha(); carrega(EV.id); }); }
function apagaSalao(id){ api('/painel/fest-salao-apagar',{id:id}).then(function(d){ if(!d.ok){ el('sl-er').textContent=d.mensagem||'Não consegui excluir.'; return; } fecha(); carrega(EV.id); }); }
function loteLinha(l){ l=l||{}; return '<div class="lote"><label class="cp">Lote<input class="inp lt-n" value="'+esc(l.nome||'')+'" placeholder="Lote 1"></label><label class="cp">Preço (R$)<input class="inp lt-p" inputmode="decimal" value="'+(l.preco?String(l.preco).replace('.',','):'')+'" placeholder="50,00"></label><label class="cp">Vale até o dia<input class="inp lt-d" type="date" value="'+esc(l.ate||'')+'"></label><label class="cp">ou até vender<input class="inp lt-q" inputmode="numeric" value="'+(l.qtd||'')+'" placeholder="100"></label><button class="btn sm er" onclick="this.parentNode.remove()" title="Tirar lote">✕</button></div>'; }
function setor(sid,id){
  var s=EV.saloes.filter(function(x){ return x.id===sid; })[0], x=id?s.setores.filter(function(y){ return y.id===id; })[0]:{nome:'',tipo:'pista',pessoas:1,qtd:'',meia:0,consumacao:'',inclui:'',lotes:[{nome:'Lote 1'}]};
  folha('<h2>'+(id?'Editar setor':'Novo setor')+' · '+esc(s.nome)+'</h2><div class="g3"><label class="cp">Nome<input class="inp" id="se-nm" maxlength="60" value="'+esc(x.nome)+'" placeholder="Ex.: Pista"></label><label class="cp">Tipo<select class="inp" id="se-tp">'+Object.keys(TIPOS).map(function(k){ return '<option value="'+k+'"'+(k===x.tipo?' selected':'')+'>'+TIPOS[k]+'</option>'; }).join('')+'</select></label><label class="cp">Pessoas por compra<input class="inp" id="se-ps" inputmode="numeric" value="'+esc(x.pessoas||1)+'"></label></div>'+
    '<div class="g3" style="margin-top:8px"><label class="cp">Quantidade à venda<input class="inp" id="se-qt" inputmode="numeric" value="'+esc(x.qtd||'')+'" placeholder="Ex.: 300"></label><label class="cp">Consumação inclusa (R$)<input class="inp" id="se-cs" inputmode="decimal" value="'+(x.consumacao?String(x.consumacao).replace('.',','):'')+'" placeholder="0,00"></label><label class="cp">O que mais inclui<input class="inp" id="se-in" maxlength="160" value="'+esc(x.inclui)+'" placeholder="Ex.: 1 garrafa · pulseira VIP"></label></div>'+
    '<label class="chk" style="margin-top:10px"><input type="checkbox" id="se-me"'+(x.meia?' checked':'')+'> Aceita meia-entrada: metade do preço, até 40% do setor, documento conferido na entrada</label><p class="info" style="margin:6px 0 0">Mesa e camarote: cada pessoa recebe um ingresso, e a consumação vira crédito na comanda do titular.</p>'+
    (function(){ var ar=(D.mesas||{})[s.area]||[], sel=x.mesas||[]; if(!s.area) return '<p class="info" style="margin:10px 0 0">Para vender mesa ou camarote escolhendo no 3D, ligue este salão a uma área do mapa (Editar salão).</p>'; if(!ar.length) return '<p class="info" style="margin:10px 0 0">A área do mapa deste salão ainda não tem mesas.</p>';
      return '<div style="margin-top:12px;font-weight:800;font-size:14px">Mesas do mapa (o cliente reserva no 3D)</div><p class="info" style="margin:2px 0 6px">Marque as mesas que este setor vende. Sem nenhuma marcada, vende por quantidade.</p><div class="mesas">'+ar.map(function(m){ return '<label class="chk"><input type="checkbox" class="se-ms" value="'+m.n+'"'+(sel.indexOf(m.n)>=0?' checked':'')+'> '+m.n+(m.lug?'<small> · '+m.lug+' lug.</small>':'')+'</label>'; }).join('')+'</div>'; })()+
    '<div style="margin-top:12px;font-weight:800;font-size:14px">Lotes de preço</div><p class="info" style="margin:2px 0 0">O lote vira o próximo na data ou ao vender a quantidade, o que vier primeiro.</p><div id="se-lts">'+(x.lotes.length?x.lotes:[{}]).map(loteLinha).join('')+'</div><button class="btn sm" style="margin-top:8px" onclick="el(\'se-lts\').insertAdjacentHTML(\'beforeend\',loteLinha({nome:\'Lote \'+(document.querySelectorAll(\'.lote\').length+1)}));datasVazias()">+ Lote</button>'+
    '<div class="erro" id="se-er"></div><div style="display:flex;gap:8px;justify-content:space-between">'+(id?'<button class="btn er" onclick="apagaSetor(\''+esc(id)+'\')">Excluir</button>':'<span></span>')+'<span><button class="btn" onclick="fecha()">Cancelar</button> <button class="btn pri" onclick="salvaSetor(\''+esc(sid)+'\',\''+(id||'')+'\')">Salvar</button></span></div>');
}
function salvaSetor(sid,id){
  var lotes=[].map.call(document.querySelectorAll('.lote'),function(l){ return {nome:l.querySelector('.lt-n').value,preco:l.querySelector('.lt-p').value,ate:l.querySelector('.lt-d').value,qtd:l.querySelector('.lt-q').value}; });
  api('/painel/fest-setor',{id:id||undefined,salao:sid,nome:el('se-nm').value,tipo:el('se-tp').value,pessoas:el('se-ps').value,qtd:el('se-qt').value,consumacao:el('se-cs').value,inclui:el('se-in').value,meia:el('se-me').checked?1:0,lotes:lotes,mesas:[].map.call(document.querySelectorAll('.se-ms:checked'),function(c){ return +c.value; })}).then(function(d){ if(!d.ok){ el('se-er').textContent=d.mensagem||'Não consegui salvar.'; return; } fecha(); carrega(EV.id); });
}
function apagaSetor(id){ api('/painel/fest-setor-apagar',{id:id}).then(function(d){ if(!d.ok){ el('se-er').textContent=d.mensagem||'Não consegui excluir.'; return; } fecha(); toast(d.oculto?'Setor escondido (já tinha vendas)':'Setor excluído'); carrega(EV.id); }); }
/* (182) cupons: o desconto sai da parte da casa */
function cupons(){
  el('corpo').innerHTML='<div class="cx"><div class="g4"><label class="cp">Código<input class="inp" id="cu-cd" maxlength="20" placeholder="Ex.: VERAO10" style="text-transform:uppercase"></label><label class="cp">Desconto<select class="inp" id="cu-tp"><option value="pct">%</option><option value="valor">R$</option></select></label><label class="cp">Valor<input class="inp" id="cu-vl" inputmode="decimal" placeholder="Ex.: 10"></label><label class="cp">Limite de usos<input class="inp" id="cu-mx" inputmode="numeric" placeholder="Sem limite"></label></div><div class="g2" style="margin-top:8px"><label class="cp">Vale até o dia (opcional)<input class="inp" type="date" id="cu-dt"></label><label class="chk" style="margin-top:22px"><input type="checkbox" id="cu-td"> Vale para todos os meus eventos</label></div><div class="erro" id="cu-er"></div><div style="display:flex;justify-content:flex-end"><button class="btn pri" onclick="criaCupom()">Criar cupom</button></div></div><div class="cx" id="cu-l">Carregando...</div>';
  datasVazias();
  api('/painel/fest-cupons?ev='+encodeURIComponent(EV.id)).then(function(d){ var l=(d&&d.cupons)||[]; el('cu-l').innerHTML=l.length?l.map(function(c){ return '<div class="vd"><div><b>'+esc(c.codigo)+'</b><small>'+(c.tipo==='pct'?String(c.valor).replace('.',',')+'%':brl(c.valor))+' de desconto · '+c.usos+(c.max_usos?' de '+c.max_usos:'')+' uso(s)'+(c.validade?' · até '+dt(c.validade):'')+(c.todos?' · todos os eventos':'')+'</small></div><button class="btn sm er" onclick="apagaCupom(\''+esc(c.id)+'\')">Desativar</button></div>'; }).join(''):'<p class="info" style="margin:0">Nenhum cupom ainda. O desconto sai da sua parte do ingresso.</p>'; });
}
function criaCupom(){ api('/painel/fest-cupom',{codigo:el('cu-cd').value,tipo:el('cu-tp').value,valor:el('cu-vl').value,max_usos:el('cu-mx').value,validade:el('cu-dt').value,evento:el('cu-td').checked?'':EV.id}).then(function(d){ if(!d.ok){ el('cu-er').textContent=d.mensagem||'Não consegui criar.'; return; } toast('Cupom criado'); cupons(); }); }
function apagaCupom(id){ api('/painel/fest-cupom-apagar',{id:id}).then(function(){ toast('Cupom desativado'); cupons(); }); }
function vendas(){
  var v=EV.vendas; el('corpo').innerHTML='<div class="kp" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><small>Ingressos</small><b>'+v.ingressos+'</b></div><div><small>Vendido</small><b>'+brl(v.total)+'</b></div><div><small>Para a casa</small><b>'+brl(v.casa)+'</b></div></div><div class="cx" id="vd-l">Carregando...</div>';
  api('/painel/fest-vendas?ev='+encodeURIComponent(EV.id)).then(function(d){ var l=(d&&d.vendas)||[]; el('vd-l').innerHTML=l.length?l.map(function(x){ return '<div class="vd"><div>'+esc(x.nome||'Comprador')+'<small>'+x.qtd+' ingresso(s) · '+new Date(x.criado).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</small></div><div style="text-align:right">'+brl(x.casa)+'<small>'+(x.status==='pago'?'Pago':'Aguardando Pix')+'</small></div></div>'; }).join(''):'<p class="info" style="margin:0">Nenhuma venda ainda.</p>'; });
}
carrega();
</script>
